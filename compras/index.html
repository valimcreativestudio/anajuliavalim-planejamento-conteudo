<style>
/* Visual calmo: poucas cores, letras legíveis, botões grandes, nada piscando. */
:root {
  --bg: #F6F4EF; --surface: #FFFFFF; --surface-2: #EEEBE4; --ink: #22201C; --muted: #67625A; --line: #DEDAD1;
  --accent: #2F5D4E; --accent-soft: #DCEAE3; --on-accent: #FFFFFF; --ok: #2F7A4F; --aviso: #8A5A12; --aviso-soft: #F6E8CF;
  --sombra: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  --raio: 16px; --gap: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --bg: #161719; --surface: #212226; --surface-2: #2B2C31; --ink: #ECEAE5; --muted: #A7A29A; --line: #36373D;
    --accent: #7FC3A6; --accent-soft: #24392F; --on-accent: #0F1F18; --ok: #86D0A2; --aviso: #E9BE74; --aviso-soft: #3A2F1C;
    --sombra: none; color-scheme: dark;
  }
}
:root[data-tema="escuro"] {
  --bg: #161719; --surface: #212226; --surface-2: #2B2C31; --ink: #ECEAE5; --muted: #A7A29A; --line: #36373D;
  --accent: #7FC3A6; --accent-soft: #24392F; --on-accent: #0F1F18; --ok: #86D0A2; --aviso: #E9BE74; --aviso-soft: #3A2F1C;
  --sombra: none; color-scheme: dark;
}
html { font-size: 17px; -webkit-text-size-adjust: 100%; }
html[data-letra="grande"] { font-size: 20px; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
html[data-calmo="1"] *, html[data-calmo="1"] *::before { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
img { max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.topo { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; }
.topo h1 { font-size: 1.35rem; margin: 0; flex: 1; letter-spacing: -.01em; }
.sync { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .82rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; min-height: 36px; }
.sync .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-e="ok"] .pt { background: var(--ok); }
.sync[data-e="pendente"] .pt, .sync[data-e="offline"] .pt { background: var(--aviso); }
main { max-width: 760px; margin: 0 auto; padding: 4px 16px 24px; }

.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
.abas button { flex: 1; max-width: 220px; background: none; border: 0; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .85rem; color: var(--muted); min-height: 64px; }
.abas button .ic { font-size: 1.45rem; line-height: 1; }
.abas button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.abas button[aria-current="page"] .ic { background: var(--accent-soft); border-radius: 999px; padding: 2px 16px; }

.seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; margin: 8px 0 14px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 10px 8px; min-height: 46px; color: var(--muted); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--sombra); }
.seg.casas button[aria-pressed="true"] { background: var(--cor, var(--accent)); color: #fff; }

.add { display: flex; gap: 8px; margin: 6px 0 14px; }
.add input { flex: 1; min-width: 0; }
input[type="text"], input[type="url"], input[type="search"], input[type="number"], input[type="password"], select, textarea { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 14px; min-height: 50px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.btn { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 12px; padding: 12px 18px; min-height: 50px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn.sec { background: var(--surface-2); color: var(--ink); }
.btn.linha { background: none; border: 2px solid var(--line); color: var(--ink); }
.btn.perigo { background: none; border: 2px solid var(--line); color: var(--aviso); }
.btn.pq { min-height: 40px; padding: 8px 12px; font-size: .9rem; }
.btn.grande { width: 100%; min-height: 58px; font-size: 1.08rem; }
.ico { border: 0; background: var(--surface-2); color: var(--ink); width: 44px; height: 44px; border-radius: 12px; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; flex: none; text-decoration: none; }
.linha-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.grupo { margin: 18px 0 6px; font-size: .9rem; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio); padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; min-height: 60px; }
.item .nome { flex: 1; min-width: 0; }
.item .nome b { font-weight: 400; display: block; overflow-wrap: anywhere; }
.item .nome small { color: var(--muted); }
.chk { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); flex: none; font-size: 1.2rem; display: inline-flex; align-items: center; justify-content: center; }
.item.on { border-color: var(--accent); background: var(--accent-soft); }
.item.on .chk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.item { width: 100%; text-align: left; color: inherit; }

.dica { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--raio); padding: 18px; color: var(--muted); text-align: center; }
.dica b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 1.05rem; }
.dica .btn { margin-top: 12px; }
.resumo { color: var(--muted); font-size: .92rem; margin: 2px 0 10px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: thin; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 44px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); font-weight: 700; }
.chip .n { color: var(--muted); font-size: .85rem; font-weight: 400; }
.chips.sub .chip { min-height: 40px; padding: 6px 12px; font-size: .92rem; }

.cards { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--line)); border-radius: var(--raio); padding: 12px; display: flex; gap: 12px; text-align: left; width: 100%; color: inherit; align-items: flex-start; }
.card .foto { width: 76px; height: 76px; border-radius: 12px; background: color-mix(in srgb, var(--c, var(--muted)) 18%, var(--surface)); flex: none; display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; }
.card .foto img { width: 100%; height: 100%; object-fit: cover; }
.card .info { flex: 1; min-width: 0; display: grid; gap: 4px; }
.card .t { font-weight: 700; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .cam { color: var(--muted); font-size: .85rem; }
.card .preco { font-size: 1.1rem; font-weight: 700; }
.card .preco small { font-weight: 400; color: var(--muted); font-size: .85rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .8rem; border-radius: 999px; padding: 2px 10px; background: var(--surface-2); color: var(--ink); }
.tag.boa { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tag.espera { background: var(--aviso-soft); color: var(--aviso); }

/* janela de edição (de baixo para cima no celular) */
.fundo { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.janela { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .fundo { align-items: center; } .janela { border-radius: 22px; max-height: 88vh; } }
.janela header { position: sticky; top: -8px; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 10px 0; z-index: 1; }
.janela header h2 { margin: 0; font-size: 1.2rem; flex: 1; }
.campo { display: grid; gap: 6px; margin: 14px 0; }
.campo > span, .campo legend { font-weight: 700; font-size: .95rem; }
.campo small { color: var(--muted); }
fieldset.campo { border: 0; padding: 0; min-width: 0; }
.link-box, .link-topo, .link-preco { min-width: 0; }
.opcoes { display: flex; gap: 8px; flex-wrap: wrap; }
.opcoes button { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 48px; flex: 1; min-width: 100px; }
.opcoes button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.link-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.link-box.melhor { border: 2px solid var(--accent); }
.link-topo { display: flex; gap: 8px; align-items: center; }
.link-topo b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-preco { display: flex; gap: 8px; align-items: center; }
.link-preco input { max-width: 170px; }
.hist { font-size: .85rem; color: var(--muted); }
.rodape-janela { display: flex; gap: 10px; margin-top: 18px; position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); background: var(--bg); padding: 12px 0 calc(6px + env(safe-area-inset-bottom)); }
.rodape-janela .btn { flex: 1; }
.cores { display: flex; gap: 8px; flex-wrap: wrap; }
.cores button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; background: var(--c); }
.cores button[aria-pressed="true"] { border-color: var(--ink); }
.arvore { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.arvore .arvore { margin: 6px 0 0 22px; }
.no { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--line)); border-radius: 12px; padding: 6px 6px 6px 12px; }
.no span { flex: 1; min-width: 0; overflow-wrap: anywhere; }

.secao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio); padding: 4px 16px 14px; margin: 14px 0; }
.secao h2 { font-size: 1.1rem; margin: 14px 0 6px; }
.secao p { color: var(--muted); margin: 4px 0 10px; }
.chave { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-top: 1px solid var(--line); }
.chave:first-of-type { border-top: 0; }
.chave label { flex: 1; }
.chave label small { display: block; color: var(--muted); }
.troca { appearance: none; width: 56px; height: 34px; border-radius: 999px; background: var(--line); position: relative; flex: none; border: 0; min-height: 0; padding: 0; }
.troca::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .15s; }
.troca:checked { background: var(--accent); }
.troca:checked::after { left: 26px; }

/* modo mercado: tela cheia, letras grandes */
.feira { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto; padding: calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); font-size: 1.15rem; }
.feira-topo { display: flex; align-items: center; gap: 10px; max-width: 640px; margin: 0 auto; }
.feira-topo h2 { flex: 1; margin: 0; font-size: 1.3rem; }
.barra { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 12px auto 4px; max-width: 640px; }
.barra i { display: block; height: 100%; background: var(--accent); }
.feira .conteudo { max-width: 640px; margin: 0 auto; }
.feira .item { min-height: 68px; }
.feira .item.on .nome b { text-decoration: line-through; color: var(--muted); }
.feira-rodape { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.feira-rodape .btn { max-width: 640px; margin: 0 auto; display: flex; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 40; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); width: max-content; box-shadow: var(--sombra); }
.toast[hidden] { display: none; }
.toast button { background: none; border: 2px solid currentColor; color: inherit; border-radius: 10px; padding: 6px 12px; font-weight: 700; min-height: 40px; }
.carregando { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: gira .9s linear infinite; vertical-align: -2px; }
@keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header class="topo">
  <h1 id="titulo">Minhas Compras</h1>
  <button class="sync" id="syncBtn" data-act="sync" type="button"><span class="pt" aria-hidden="true"></span><span id="syncTxt">Neste aparelho</span></button>
</header>
<main id="main" tabindex="-1"></main>
<nav class="abas" aria-label="Seções">
  <button type="button" data-act="aba" data-v="mercado"><span class="ic" aria-hidden="true">🛒</span>Mercado</button>
  <button type="button" data-act="aba" data-v="desejos"><span class="ic" aria-hidden="true">✨</span>Desejos</button>
  <button type="button" data-act="aba" data-v="ajustes"><span class="ic" aria-hidden="true">⚙️</span>Ajustes</button>
</nav>

<script src="config.js"></script>
<script>
"use strict";
// ================= base =================
const $ = s => document.querySelector(s);
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const hojeISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const real = n => n == null || n === "" ? "" : Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const semAcento = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

const LS = "compras.v1", LSA = "compras.ajustes", LSC = "compras.conexao";
let D = lsGet(LS, null) || { regs: {}, pend: {}, rev: 0 };
let A = Object.assign({ tema: "auto", letra: "normal", calmo: false, espera: true, diasEspera: 7, aba: "mercado", casa: "", merc: "lista", cat: "", status: "quero", ordem: "prioridade" }, lsGet(LSA, {}));
let C = Object.assign({ api: "", chave: "" }, lsGet(LSC, {}));
const apiUrl = () => (C.api || (window.CONFIG && window.CONFIG.API_URL) || "").trim();
const salvarAjustes = () => lsSet(LSA, A);
function persistir() { if (!lsSet(LS, D)) toast("Não consegui guardar neste aparelho. Libere espaço no navegador."); }

// ================= dados =================
const SETORES = [
  ["hortifruti", "🥬", "Hortifrúti"], ["carnes", "🥩", "Carnes e frios"], ["padaria", "🥖", "Padaria"], ["mercearia", "🍚", "Mercearia"],
  ["laticinios", "🧀", "Laticínios e ovos"], ["bebidas", "🧃", "Bebidas"], ["congelados", "🧊", "Congelados"], ["limpeza", "🧽", "Limpeza"],
  ["higiene", "🧴", "Higiene"], ["pet", "🐾", "Pet"], ["outros", "📦", "Outros"]
];
const setor = id => SETORES.find(s => s[0] === id) || SETORES[SETORES.length - 1];
const PALAVRAS = {
  hortifruti: "alface tomate cebola alho batata cenoura banana maca laranja limao mamao abacate couve cheiro verde fruta legume verdura chuchu abobrinha pepino pimentao uva morango melancia melao mandioca inhame beterraba brocolis repolho manga",
  carnes: "carne frango peixe linguica presunto mortadela salame bacon file costela moida patinho alcatra picanha salsicha peito coxa sobrecoxa",
  padaria: "pao bisnaguinha bolo torrada rosca biscoito de polvilho",
  mercearia: "arroz feijao acucar sal oleo azeite cafe macarrao farinha fuba molho extrato milho ervilha atum sardinha tempero vinagre aveia granola biscoito bolacha achocolatado gelatina fermento maionese ketchup mostarda pipoca amendoim cha leite condensado creme de leite",
  laticinios: "leite queijo manteiga margarina iogurte requeijao ovo ovos nata",
  bebidas: "agua refrigerante suco cerveja vinho energetico isotonico",
  congelados: "sorvete pizza lasanha nuggets hamburguer polpa batata frita congelad",
  limpeza: "detergente sabao amaciante agua sanitaria desinfetante esponja vassoura rodo pano saco de lixo lixo alcool limpa multiuso cloro lava",
  higiene: "papel higienico sabonete shampoo xampu condicionador pasta de dente creme dental escova desodorante absorvente fio dental algodao cotonete hidratante",
  pet: "racao areia petisco"
};
function adivinharSetor(nome) {
  const n = " " + semAcento(nome) + " ";
  let melhor = "outros", tam = 0;
  for (const [s, lista] of Object.entries(PALAVRAS)) {
    for (const p of lista.split(" ")) if (p.length > 2 && n.includes(p) && p.length > tam) { melhor = s; tam = p.length; }
  }
  for (const [s, lista] of Object.entries(PALAVRAS)) for (const frase of ["sabao em po", "agua sanitaria", "papel higienico", "pasta de dente", "creme dental", "saco de lixo", "leite condensado", "creme de leite", "batata frita", "fio dental"]) if (n.includes(frase) && lista.includes(frase)) return s;

    html += `<div class="chips sub" role="group" aria-label="Dentro de ${h(cam[i].nome)}"><button type="button" class="chip" data-act="dcat" data-v="${h(cam[i].id)}" style="--c:${h(corCat(cam[i].id))}" aria-pressed="${A.cat === cam[i].id}">Tudo em ${h(cam[i].nome)}</button>${subs.map(c => `<button type="button" class="chip" data-act="dcat" data-v="${h(c.id)}" style="--c:${h(corCat(c.id))}" aria-pressed="${cam[i + 1] && cam[i + 1].id === c.id}"><span aria-hidden="true">${h(c.icone || "")}</span>${h(c.nome)} <span class="n">${conta(c.id)}</span></button>`).join("")}</div>`;
  }
  html += `<div class="resumo"><span id="dResumo"></span><span class="linha-acoes"><label class="sr" for="dOrdem">Ordem</label><select id="dOrdem" data-ajuste="ordem" style="min-height:44px;padding:6px 10px;width:auto"><option value="prioridade"${A.ordem === "prioridade" ? " selected" : ""}>Prioridade</option><option value="preco"${A.ordem === "preco" ? " selected" : ""}>Menor preço</option><option value="recente"${A.ordem === "recente" ? " selected" : ""}>Mais recentes</option></select>${apiUrl() && C.chave && A.status === "quero" ? `<button class="btn sec pq" type="button" data-act="datualizar">↻ Preços</button>` : ""}</span></div>`;
  html += `<input type="search" id="dBusca" placeholder="Buscar pelo nome" aria-label="Buscar pelo nome" style="margin-bottom:12px" value="${h(BUSCA)}"><div id="dLista"></div>`;
  return html;
}
let BUSCA = "";
function desejosFiltrados() {
  let l = todos("desejo").filter(d => (d.status || "quero") === A.status);
  if (A.cat === "sem") l = l.filter(d => !d.categoriaId || !pegar(d.categoriaId));
  else if (A.cat) { const s = descendentes(A.cat); l = l.filter(d => s.has(d.categoriaId)); }
  const b = semAcento(BUSCA); if (b) l = l.filter(d => semAcento(d.nome).includes(b) || (d.links || []).some(x => semAcento(x.loja).includes(b)));
  const prio = d => (PRIORIDADES.find(p => p[0] === d.prioridade) || PRIORIDADES[1])[2];
  const pr = d => { const m = melhorLink(d); return m ? m.preco : Infinity; };
  if (A.ordem === "preco") l.sort((a, b) => pr(a) - pr(b));
  else if (A.ordem === "recente") l.sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  else l.sort((a, b) => prio(a) - prio(b) || (b.criadoEm || 0) - (a.criadoEm || 0));
  return l;
}
function pintarLista() {
  const box = $("#dLista"); if (!box) return;
  const l = desejosFiltrados();
  const total = l.reduce((s, d) => { const m = melhorLink(d); return s + (m ? m.preco : 0); }, 0);
  const r = $("#dResumo"); if (r) r.textContent = `${l.length} ${l.length === 1 ? "item" : "itens"}${total ? " · " + real(total) : ""}`;
  if (!l.length) {
    box.innerHTML = BUSCA ? `<div class="dica"><b>Nada com “${h(BUSCA)}”</b>Tente outra palavra.</div>`
      : A.status === "quero" ? `<div class="dica"><b>Nada por aqui ainda</b>Cole o link de um produto no campo lá em cima. Eu busco o nome, a foto e o preço. Organizar pode ficar para depois.</div>`
        : `<div class="dica"><b>Nada em “${h(STATUS.find(s => s[0] === A.status)[1])}”</b>Quando você marcar um desejo assim, ele aparece aqui.</div>`;
    return;
  }
  box.innerHTML = `<div class="cards">${l.map(cartao).join("")}</div>`;
}
function cartao(d) {
  const m = melhorLink(d), cor = corCat(d.categoriaId), cam = caminho(d.categoriaId).map(c => c.nome).join(" › ");
  const p = PRIORIDADES.find(x => x[0] === d.prioridade);
  const tags = [];
  if (p && d.status !== "chegou" && d.status !== "comprei") tags.push(`<span class="tag">${h(p[1])}</span>`);
  if (m && m.antes && m.preco < m.antes) tags.push(`<span class="tag boa">↓ baixou ${h(real(m.antes - m.preco))}</span>`);
  if ((d.status || "quero") === "quero" && d.liberaEm && diasAte(d.liberaEm) > 0) tags.push(`<span class="tag espera">⏳ esfriando: ${diasAte(d.liberaEm)} ${diasAte(d.liberaEm) === 1 ? "dia" : "dias"}</span>`);
  const lendoAlgo = (d.links || []).some(l => lendo.has(l.id));
  const nl = (d.links || []).length;
  return `<button type="button" class="card" data-act="dabrir" data-id="${h(d.id)}" style="--c:${h(cor)}"><span class="foto" data-ic="${h(iconeCat(d.categoriaId))}">${d.foto ? `<img src="${h(d.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span aria-hidden="true">${h(iconeCat(d.categoriaId))}</span>`}</span><span class="info"><span class="t">${lendoAlgo && d.nomeProvisorio ? '<span class="carregando" aria-hidden="true"></span> Lendo o link…' : h(d.nome || "Sem nome")}</span><span class="cam">${cam ? h(cam) : "📥 Não organizado"}</span><span class="preco">${m ? h(real(m.preco)) + ` <small>${h(m.loja || "")}${nl > 1 ? ` · ${nl} lojas` : ""}</small>` : lendoAlgo ? "" : `<small>${nl ? "Sem preço ainda" : "Sem link"}</small>`}</span>${tags.length ? `<span class="tags">${tags.join("")}</span>` : ""}</span></button>`;
}

// ================= ações =================
const ACT = {
  aba: d => { A.aba = d.v; salvarAjustes(); render(); window.scrollTo(0, 0); },
  sync: () => { if (apiUrl() && C.chave) sincronizar(); else { A.aba = "ajustes"; salvarAjustes(); render(); } },
  // mercado
  casa: d => { A.casa = d.v; salvarAjustes(); render(); },
  merc: d => { A.merc = d.v; salvarAjustes(); render(); },
  mtoggle: d => { const i = pegar(d.id); if (!i) return; i.precisa = !i.precisa; i.carrinho = false; salvar("mercado", i); render(); },
  mtenho: d => { const i = pegar(d.id); if (!i) return; mudar([i.id], () => { i.precisa = false; i.carrinho = false; gravar("mercado", i); }, `“${i.nome}” saiu da lista.`); },
  medit: d => { ED = pegar(d.id); if (ED) abrirModal(mItemModal); },
  msalvar: () => { const nome = String(ED.nome || "").trim(); if (!nome) return toast("Escreva o nome do item."); ED.nome = nome; salvar("mercado", ED); fecharModal(); },
  mapagar: () => { const it = ED; fecharModal(); mudar([it.id], () => apagar(it.id), `“${it.nome}” apagado.`); },
  mcopiar: () => {
    const outras = casas().filter(c => c.id !== ED.casaId); const ids = [];
    outras.forEach(c => { if (!itensCasa(c.id).some(x => semAcento(x.nome) === semAcento(ED.nome))) ids.push(gravar("mercado", { nome: ED.nome, setor: ED.setor, qtd: ED.qtd || "", casaId: c.id, precisa: false })); });
    persistir(); agendarSync(); toast(ids.length ? `Copiado para ${outras.map(c => c.nome).join(", ")}.` : "A outra casa já tem esse item.");
  },
  basicos: () => {
    const casa = casaAtual(); const tem = new Set(itensCasa(casa.id).map(i => semAcento(i.nome))); const ids = [];
    mudar(ids, () => { BASICOS.forEach(n => { if (!tem.has(semAcento(n))) ids.push(gravar("mercado", { nome: n, setor: adivinharSetor(n), casaId: casa.id, precisa: false })); }); A.merc = "tudo"; salvarAjustes(); }, null);
    toast(`${ids.length} itens básicos em ${casa.nome}. Toque no que está faltando.`, () => { ids.forEach(apagar); persistir(); render(); agendarSync(); });
  },
  feira: () => { const c = casaAtual(); FEIRA = { casaId: c.id }; $("#feira").innerHTML = vFeira(); document.body.style.overflow = "hidden"; pedirTelaLigada(); const b = $("#feira .btn"); if (b) b.focus(); },
  ffechar: () => { FEIRA = null; $("#feira").innerHTML = ""; document.body.style.overflow = ""; if (wake) { wake.release().catch(() => {}); wake = null; } render(); },
  fcheck: d => { const i = pegar(d.id); if (!i) return; i.carrinho = !i.carrinho; salvar("mercado", i); $("#feira").innerHTML = vFeira(); const b = $(`#feira [data-id="${CSS.escape(d.id)}"]`); if (b) b.focus(); },
  fterminar: () => {
    const c = pegar(FEIRA.casaId); const feitos = itensCasa(c.id).filter(i => i.precisa && i.carrinho);
    ACT.ffechar();
    mudar(feitos.map(i => i.id), () => feitos.forEach(i => { i.precisa = false; i.carrinho = false; gravar("mercado", i); }), `Compra registrada: ${feitos.length} ${feitos.length === 1 ? "item" : "itens"}. 🌿`);
  },
  // desejos
  dstatus: d => { A.status = d.v; salvarAjustes(); render(); },
  dcat: d => { A.cat = d.v; salvarAjustes(); render(); },
  dabrir: d => { const x = pegar(d.id); if (!x) return; ED = clone(x); ED.links = ED.links || []; abrirModal(dModal); },
  datualizar: async (d, b) => {
    const lista = desejosFiltrados().flatMap(x => (x.links || []).map(l => [x.id, l.id]));
    if (!lista.length) return toast("Nenhum link para atualizar.");
    b.disabled = true; let ok = 0;
    for (let i = 0; i < lista.length; i++) { b.textContent = `${i + 1} de ${lista.length}…`; if (await lerLink(lista[i][0], lista[i][1])) ok++; }
    toast(`Preços conferidos: ${ok} de ${lista.length} links.`); render();
  },
  edprio: d => { ED.prioridade = d.v; redesenharModal(); },
  edstatus: d => { ED.status = d.v; if (d.v !== "quero" && !ED.compradoEm) ED.compradoEm = hojeISO(); redesenharModal(); },
  edaddlink: () => {
    const inp = $("#novoLink"); const { url } = separarLink(inp.value);
    if (!url) { toast("Cole um link que comece com https://"); inp.focus(); return; }
    const l = { id: uid(), url, loja: lojaDe(url) }; ED.links.push(l);
    redesenharModal();
    if (!ED.novo && apiUrl() && C.chave) { const salvo = clone(ED); delete salvo.novo; gravar("desejo", salvo); persistir(); lerLink(ED.id, l.id); }
  },
  edrmlink: d => { ED.links.splice(Number(d.i), 1); redesenharModal(); },
  edler: d => { const l = ED.links[Number(d.i)]; if (!l) return; const salvo = clone(ED); delete salvo.novo; gravar("desejo", salvo); persistir(); lerLink(ED.id, l.id); redesenharModal(); },
  edsalvar: () => {
    const nome = String(ED.nome || "").trim(); if (!nome) return toast("Escreva o que é.");
    ED.nome = nome; ED.nomeProvisorio = false; const x = clone(ED); delete x.novo; salvar("desejo", x); fecharModal();
  },
  edapagar: () => { const x = ED; fecharModal(); mudar([x.id], () => apagar(x.id), `“${x.nome}” apagado.`); },
  // categorias
  cats: () => { CM = {}; abrirModal(catModal); },
  cmnova: d => { CM = { editando: "", pai: d.pai || "", nome: "", icone: "", cor: d.pai ? "" : CORES[cats().length % CORES.length] }; redesenharModal(); const f = $("#modal [data-foco]"); if (f) f.focus(); },
  cmedit: d => { const c = pegar(d.id); CM = { editando: c.id, pai: c.pai || "", nome: c.nome, icone: c.icone || "", cor: c.cor || "" }; redesenharModal(); const f = $("#modal [data-foco]"); if (f) f.focus(); },
  cmcor: d => { CM.cor = d.v; redesenharModal(); },
  cmvoltar: () => { CM = {}; redesenharModal(); },
  cmsalvar: () => {
    const nome = String(CM.nome || "").trim(); if (!nome) return toast("Escreva o nome da categoria.");
    const antiga = CM.editando ? pegar(CM.editando) : null;
    salvar("categoria", { id: CM.editando || undefined, nome, icone: String(CM.icone || "").trim(), cor: CM.pai ? "" : CM.cor, pai: CM.pai, ordem: antiga ? antiga.ordem : Date.now() });
    CM = {}; redesenharModal(); render();
  },
  cmapagar: () => {
    const ids = [...descendentes(CM.editando)]; const nome = pegar(CM.editando).nome;
    CM = {}; mudar(ids, () => ids.forEach(apagar), `Categoria “${nome}” apagada.`); redesenharModal();
  },
  // casas
  casaedit: d => { ED = d.id ? pegar(d.id) : { nome: "", cor: CORES[casas().length % CORES.length], ordem: casas().length + 1 }; abrirModal(casaModal); },
  casacor: d => { ED.cor = d.v; redesenharModal(); },
  casasalvar: () => { const nome = String(ED.nome || "").trim(); if (!nome) return toast("Escreva o nome da casa."); ED.nome = nome; salvar("casa", ED); fecharModal(); },
  casaapagar: () => {
    const c = ED, itens = itensCasa(c.id).map(i => i.id); fecharModal();
    mudar([c.id, ...itens], () => { apagar(c.id); itens.forEach(apagar); if (A.casa === c.id) A.casa = ""; }, `Casa “${c.nome}” apagada.`);
  },
  // janela
  fechar: () => fecharModal(),
  fundo: (d, b, e) => { if (e.target === b) fecharModal(); },
  // conexão
  syncagora: () => { estado = "ok"; sincronizar(); },
  desconectar: () => { if (Object.keys(D.pend).length && !confirm("Ainda tem mudanças que não chegaram na planilha. Desconectar mesmo assim?")) return; C = { api: "", chave: "" }; lsSet(LSC, C); estado = "local"; render(); toast("Este aparelho foi desconectado. Os dados continuam aqui."); },
  exportar: () => {
    const dados = Object.values(D.regs).filter(r => !r.apagado);
    const blob = new Blob([JSON.stringify({ app: "minhas-compras", em: new Date().toISOString(), registros: dados }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `minhas-compras-${hojeISO()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  if (b.dataset.act === "fundo" && e.target !== b) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  if (b.tagName !== "A") e.preventDefault();
  f(b.dataset, b, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ed && ED) ED[t.dataset.ed] = t.value;
  if (t.dataset.cm && CM) CM[t.dataset.cm] = t.value;
  if (t.id === "dBusca") { BUSCA = t.value; pintarLista(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.edpreco !== undefined && ED) {
    const l = ED.links[Number(t.dataset.edpreco)]; const s = t.value.replace(/[^\d.,]/g, "");
    const n = s.includes(",") ? parseFloat(s.replace(/\./g, "").replace(",", ".")) : parseFloat(s);
    if (l) { if (n > 0) { const v = Math.round(n * 100) / 100; if (v !== l.preco) { aplicarPreco(l, v); l.precoManual = true; l.erro = "manual"; } } else { l.preco = null; } }
    setTimeout(() => { const foco = document.activeElement && document.activeElement.id; redesenharModal(); const f = foco && document.getElementById(foco); if (f) f.focus(); }, 0);
    return;
  }
  if (t.dataset.edcat !== undefined && ED) {
    const n = Number(t.dataset.edcat), cam = caminho(ED.categoriaId);
    ED.categoriaId = t.value || (n > 0 && cam[n - 1] ? cam[n - 1].id : "");
    redesenharModal(); return;
  }
  if (t.dataset.ajuste) {
    const k = t.dataset.ajuste;
    if (k === "letra") A.letra = t.checked ? "grande" : "normal";
    else if (k === "calmo" || k === "espera") A[k] = t.checked;
    else if (k === "diasEspera") A.diasEspera = Math.min(60, Math.max(1, Number(t.value) || 7));
    else A[k] = t.value;
    salvarAjustes(); aplicarVisual(); render();
    const de = document.getElementById(t.id); if (de) de.focus();
  }
  if (t.id === "aImport" && t.files[0]) importar(t.files[0]);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const tipo = f.dataset.form;
  if (tipo === "madd") {
    const inp = $("#mNome"), nome = inp.value.trim(); if (!nome) return inp.focus();
    const casa = casaAtual(); const ex = itensCasa(casa.id).find(i => semAcento(i.nome) === semAcento(nome));
    if (ex) { ex.precisa = true; salvar("mercado", ex); toast(`“${ex.nome}” voltou para a lista.`); }
    else salvar("mercado", { nome: nome.charAt(0).toUpperCase() + nome.slice(1), setor: adivinharSetor(nome), casaId: casa.id, precisa: true });
    A.merc = "lista"; salvarAjustes(); render(); $("#mNome").focus();
  }
  if (tipo === "dadd") {
    const inp = $("#dTexto"), v = inp.value.trim(); if (!v) return inp.focus();
    const { url, resto } = separarLink(v);
    const agora = Date.now();
    const d = { nome: resto || (url ? "Item da " + lojaDe(url) : ""), nomeProvisorio: !!url && !resto, links: url ? [{ id: uid(), url, loja: lojaDe(url) }] : [], categoriaId: A.cat && A.cat !== "sem" ? A.cat : "", prioridade: "muito", status: "quero", criadoEm: agora };
    if (A.espera) { const lib = new Date(); lib.setDate(lib.getDate() + (Number(A.diasEspera) || 7)); d.liberaEm = lib.getFullYear() + "-" + String(lib.getMonth() + 1).padStart(2, "0") + "-" + String(lib.getDate()).padStart(2, "0"); }
    const id = salvar("desejo", d);
    if (A.status !== "quero") { A.status = "quero"; salvarAjustes(); }
    inp.value = ""; BUSCA = ""; render();
    if (url && apiUrl() && C.chave) lerLink(id, d.links[0].id).then(ok => toast(ok ? "Guardado, com o preço do link." : "Guardado. Não consegui o preço; toque no item para digitar."));
    else toast(url ? "Guardado. Toque no item para digitar o preço." : "Guardado.");
  }
  if (tipo === "conectar") conectar();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (MODAL) { e.preventDefault(); if (CM && CM.editando !== undefined) ACT.cmvoltar(); else fecharModal(); } else if (FEIRA) ACT.ffechar(); }
  if (e.key === "Tab" && (MODAL || FEIRA)) {
    const box = MODAL ? $("#modal .janela") : $("#feira .feira"); if (!box) return;
    const f = [...box.querySelectorAll("button:not([disabled]),a[href],input,select,textarea")].filter(x => x.offsetParent !== null || x.type === "file");
    if (!f.length) return; const ini = f[0], fim = f[f.length - 1];
    if (e.shiftKey && document.activeElement === ini) { e.preventDefault(); fim.focus(); } else if (!e.shiftKey && document.activeElement === fim) { e.preventDefault(); ini.focus(); }
  }
});

async function conectar() {
  const url = $("#cApi").value.trim(), chave = $("#cChave").value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/[^\s]+$/.test(url)) return toast("O endereço precisa começar com https://script.google.com");
  if (!chave) return toast("Digite a chave de acesso.");
  const antes = C; C = { api: url, chave };
  const b = document.querySelector('[data-form="conectar"] button'); if (b) { b.disabled = true; b.textContent = "Conectando…"; }
  try {
    await api("ping");
    lsSet(LSC, C); toast("Conectado! Juntando os dados…"); estado = "ok";
    Object.keys(D.regs).forEach(id => { D.pend[id] = 1; }); D.rev = 0; persistir();
    await sincronizar(); render();
  } catch (e) {
    C = antes; if (b) { b.disabled = false; b.textContent = "Conectar"; }
    toast(e.codigo === "chave" ? "Chave errada. Confira no e-mail." : "Não consegui falar com a planilha. Confira o endereço.");
  }
}
function importar(arq) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result); const l = Array.isArray(j.registros) ? j.registros : [];
      const ok = l.filter(r => r && typeof r.id === "string" && /^[\w-]{1,64}$/.test(r.id) && ["casa", "mercado", "categoria", "desejo"].includes(r.tipo) && r.dados && typeof r.dados === "object");
      if (!ok.length) return toast("Esse arquivo não tem dados do app.");
      const ids = ok.map(r => r.id);
      mudar(ids, () => ok.forEach(r => gravar(r.tipo, Object.assign({}, r.dados, { id: r.id }))), `${ok.length} registros trazidos da cópia.`);
    } catch (e) { toast("Não consegui ler esse arquivo."); }
  };
  fr.readAsText(arq);
}
function aplicarVisual() {
  const r = document.documentElement;
  if (A.tema === "auto") delete r.dataset.tema; else r.dataset.tema = A.tema;
  r.dataset.letra = A.letra; if (A.calmo) r.dataset.calmo = "1"; else delete r.dataset.calmo;
}

// foto que não carrega: mostra o símbolo da categoria (ou some, na janela)
document.addEventListener("error", e => {
  const t = e.target; if (!t || t.tagName !== "IMG") return;
  const box = t.closest(".foto"); if (box) box.textContent = box.dataset.ic || "🛍️"; else t.remove();
}, true);

// ================= início =================
semear(); aplicarVisual(); render();
if (apiUrl() && C.chave) sincronizar();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { agendarSync(200); if (FEIRA) pedirTelaLigada(); } });
window.addEventListener("online", () => agendarSync(200));
window.addEventListener("offline", () => { estado = "offline"; atualizarSync(); });
setInterval(() => { if (document.visibilityState === "visible" && !syncando) agendarSync(0); }, 60000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
</script>
</body>
