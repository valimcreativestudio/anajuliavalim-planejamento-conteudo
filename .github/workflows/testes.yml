# Roda todos os testes a cada mudança enviada para o GitHub.
# Se algum teste falhar, aparece um X vermelho no commit e o GitHub manda e-mail.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o navegador de teste
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Rodar os testes
        run: node tests/rodar.js
      - name: Guardar as capturas de tela (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: tests/capturas/
          retention-days: 7
