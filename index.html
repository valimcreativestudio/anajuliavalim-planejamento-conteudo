      <div class="steps">${ETAPAS.map((e, i) => `<span class="${i === at ? "on" : i < at ? "done" : ""}">${i < at ? "✓ " : ""}${e}</span>`).join("")}</div></div>
    ${p.motivo ? `<div class="motivo"><b>${p.status === "Ideia reprovada" ? "Ideia reprovada" : "Ajustes pedidos"}</b>${esc(p.motivo)}</div>` : ""}
    ${p.agTipo && ["Agendado", "Postado"].includes(p.status) ? `<div class="kv" style="font-size:13.5px">⏰ <b>${esc(p.agTipo)}</b> agendado para ${esc(brFull(p.agData))} às ${esc(p.agHora)}${p.postLink ? ` · <a class="lnk" href="${esc(p.postLink)}" target="_blank" rel="noopener">Ver post publicado</a>` : ""}</div>` : ""}
    ${rej ? `<div class="rej"><label class="field"><span>${rej === "reprovarIdeia" ? "Por que a ideia não foi validada?" : "Por que o conteúdo não foi aprovado? O que precisa mudar?"}</span><textarea id="rejMotivo" placeholder="Escreva o motivo para a social media ajustar"></textarea></label>
        <div class="row"><button class="btn danger" type="button" onclick="acaoEditor('${rej}')">Confirmar</button><button class="btn" type="button" onclick="S.rejDlg=null;drawEditor()">Cancelar</button></div></div>`
      : acoes.length ? `<div class="row">${acoes.map(k => {
          const a = ACOES[k];
          return a.motivo ? `<button class="btn danger" type="button" onclick="S.rejDlg='${k}';drawEditor();$('#rejMotivo').focus()">${a.label}</button>`
            : `<button class="btn ${a.tipo === "ok" ? "ok" : "primary"}" type="button" onclick="acaoEditor('${k}')">${a.label}</button>`;
        }).join("")}</div>` : `<span class="muted" style="font-size:13px">${p.status === "Em validação" || p.status === "Em aprovação" ? "Aguardando o aprovador." : p.status === "Postado" ? "Conteúdo publicado." : "Nenhuma ação sua nesta etapa."}</span>`}
    ${hist.length ? `<details><summary class="muted" style="cursor:pointer;font-size:13px">Histórico (${hist.length})</summary><ul class="hist">${hist.map(h => `<li>${new Date(h.em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })} · <b>${esc(h.por)}</b> ${esc((h.acao || "").toLowerCase())}${h.motivo ? `: "${esc(h.motivo)}"` : ""}</li>`).join("")}</ul></details>` : ""}
  </div>`;
}
function editorMudou() {
  if (!EDIT.id) return true;
  const g = gather();
  return Object.keys(g).some(k => !["atualizado", "marcaId"].includes(k) && String(g[k] ?? "").trim() !== String(EDIT[k] ?? "").trim());
}
async function acaoEditor(k) {
  const a = ACOES[k];
  if (a.painel) {
    if (S.canWrite && editorMudou()) { const id = await salvarEditor(false); if (!id) return; }
    const id = EDIT.id; $("#dlg").close(); abrirAgenda(id, k); return;
  }
  const motivo = a.motivo ? ($("#rejMotivo")?.value || "").trim() : "";
  if (a.motivo && !motivo) return toast("Escreva o motivo.");
  // quem edita salva o que mudou antes de mandar para a próxima etapa
  if (a.quem === "editar" && S.canWrite && editorMudou()) { const id = await salvarEditor(false); if (!id) return; }
  await acao(EDIT.id, k, motivo);
  const p = S.posts.find(x => x.id === EDIT.id);
  if (p && $("#dlg").open) { EDIT = { ...p }; S.rejDlg = null; drawEditor(); }
}

const soDigitos = t => String(t || "").replace(/\D/g, "");
function telWa(t) { const d = soDigitos(t); return d.length === 10 || d.length === 11 ? "55" + d : d; }
function fmtTel(t) {
  const d = soDigitos(t).replace(/^55(?=\d{10,11}$)/, "");
  return d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : t;
}
function gerarSenha() {
  const c = "abcdefghjkmnpqrstuvwxyz23456789";
  const a = new Uint32Array(8); crypto.getRandomValues(a);
  return [...a].map(n => c[n % c.length]).join("");
}
function listaMarcas(u, artigo) {
  // artigo: "pela" (responsável pela marca X) ou "da" (conteúdos da marca X)
  if (TODAS.includes(u.papel) || (u.marcas || []).includes("*")) return (artigo === "pela" ? "por" : "de") + " todas as marcas da agência";
  const n = (u.marcas || []).map(nomeMarca).filter(Boolean);
  if (!n.length) return (artigo === "pela" ? "pelas" : "das") + " marcas que vamos liberar para você em breve";
  const nomes = n.length === 1 ? n[0] : n.slice(0, -1).join(", ") + " e " + n[n.length - 1];
  return (artigo === "pela" ? (n.length === 1 ? "pela marca " : "pelas marcas ") : (n.length === 1 ? "da marca " : "das marcas ")) + nomes;
}

/* ---------- Atividade da equipe ---------- */
function quando(ms) {
  if (!ms) return "nunca";
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 2) return "agora";
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `há ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? "ontem" : `há ${d} dias`;
}
function vAtividade() {
  const dias = S.ativDias || 7, desde = Date.now() - dias * 864e5;
  const pessoas = S.usuarios.filter(u => u.ativo && u.id !== S.eu.id);
  const eventos = [];
  S.posts.forEach(p => (p.historico || []).forEach(h => eventos.push({ ...h, post: p })));
  eventos.sort((a, b) => b.em - a.em);
  const dele = u => eventos.filter(e => e.uid ? e.uid === u.id : e.por === u.nome);
  const conta = (ev, txt) => ev.filter(e => e.em >= desde && txt.some(t => (e.acao || "").startsWith(t))).length;
  const linhas = pessoas.sort((a, b) => a.nome.localeCompare(b.nome)).map(u => {
    const ev = dele(u), ult = Math.max(Number(u.ultimoAcesso) || 0, ev[0]?.em || 0);
    const marcasU = TODAS.includes(u.papel) || u.marcas.includes("*") ? null : u.marcas;
    const daMarca = p => !marcasU || marcasU.includes(p.marcaId);
    const pend = u.papel === "social" ? S.posts.filter(p => daMarca(p) && REPROVADOS.includes(p.status)).length
      : u.papel === "aprovador" ? S.posts.filter(p => daMarca(p) && ["Em validação", "Em aprovação"].includes(p.status)).length : 0;
    const parado = !ult || Date.now() - ult > 3 * 864e5;
    return `<tr>
      <td><b>${esc(u.nome)}</b><div class="muted">${esc(PAPEIS[u.papel] || "")}</div></td>
      <td class="num"${parado ? ' style="color:var(--danger)"' : ""}>${quando(ult)}</td>
      <td class="num">${conta(ev, ["Criou"])}</td>
      <td class="num">${conta(ev, ["Editou"])}</td>
      <td class="num">${conta(ev, ["Enviou"])}</td>
      <td class="num">${conta(ev, ["Validou", "Aprovou"])}</td>
      <td class="num">${conta(ev, ["Reprovou", "Pediu"])}</td>
      <td class="num">${pend ? `<span class="pill" style="--c:var(--danger)"><span class="dot"></span>${pend}</span>` : "0"}</td>
    </tr>`;
  }).join("");
  const feed = eventos.slice(0, 40).map(e => `<li><span class="muted">${new Date(e.em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span> · <b>${esc(e.por)}</b> ${esc((e.acao || "").toLowerCase())} <a class="lnk" href="javascript:void 0" onclick="openEditor('${esc(e.post.id)}')">${esc(nm(e.post))}</a> <span class="muted">(${esc(nomeMarca(e.post.marcaId))})</span>${e.motivo ? `: "${esc(e.motivo)}"` : ""}</li>`).join("");
  return head(ehAdmin() ? "Administração" : ehDiretor() ? "Direção" : "Gestão", "Atividade da equipe", `<select id="ativDias" class="st-sel" aria-label="Período" onchange="S.ativDias=+this.value;render()">${[[1, "Hoje e ontem"], [7, "Últimos 7 dias"], [30, "Últimos 30 dias"]].map(([d, l]) => `<option value="${d}"${d === dias ? " selected" : ""}>${l}</option>`).join("")}</select>`) + equipeNav() +
    `<p class="sec-intro">O que cada pessoa fez no período. "Último sinal" é o último acesso ou a última ação no sistema; fica em vermelho depois de 3 dias sem nada. "Pendências" são postagens devolvidas esperando a social media, ou ideias e conteúdos esperando o aprovador.</p>
    ${pessoas.length ? `<div class="table-wrap"><table style="min-width:760px"><thead><tr><th>Pessoa</th><th>Último sinal</th><th>Criou</th><th>Editou</th><th>Enviou</th><th>Validou / aprovou</th><th>Reprovou / pediu ajustes</th><th>Pendências</th></tr></thead><tbody>${linhas}</tbody></table></div>`
      : `<div class="empty"><strong>Ninguém na equipe ainda</strong><span>O administrador cadastra as pessoas na aba Equipe.</span></div>`}
    <section class="apv-sec"><h2>Últimas ações</h2>${feed ? `<ul class="hist" style="font-size:13.5px;gap:6px">${feed}</ul>` : `<p class="muted">Nada registrado ainda.</p>`}</section>`;
}
function boasVindasHtml() {
  const b = S.boasVindas;
  if (!b) return "";
  const link = b.tel ? `https://wa.me/${telWa(b.tel)}?text=${encodeURIComponent(b.msg)}` : "";
  return `<div class="panel" style="display:grid;gap:10px;margin-bottom:16px;border-color:var(--st-postado)">
    <h2>${b.novo ? "Envie o acesso para " : "Envie a nova senha para "}${esc(b.nome)}</h2>
    <label class="field"><span>Mensagem (dá para editar antes de enviar)</span><textarea id="bvMsg" rows="7" oninput="S.boasVindas.msg=this.value;const a=$('#bvWa');if(a)a.href='https://wa.me/${esc(telWa(b.tel))}?text='+encodeURIComponent(this.value)">${esc(b.msg)}</textarea></label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      ${link ? `<a class="btn ok" id="bvWa" href="${esc(link)}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a>` : `<span class="muted">Cadastre o WhatsApp da pessoa para enviar direto. Por enquanto, copie a mensagem.</span>`}
      <button class="btn" type="button" onclick="copiarTexto($('#bvMsg').value,'Mensagem copiada')">Copiar mensagem</button>
      <button class="btn" type="button" onclick="S.boasVindas=null;render()">Fechar</button>
    </div>
    <span class="muted" style="font-size:12.5px">A senha aparece só agora. Depois de fechar, para mandar de novo, gere uma nova senha na edição da pessoa.</span>
  </div>`;
}
async function excluirPost() {
  try { await api("excluirPauta", { id: EDIT.id }); $("#dlg").close(); await carregar(); toast("Postagem excluída"); } catch (e) { writeFail(e); }
}
function duplicar() {
  const body = gather();
  EDIT = { ...body, status: "Ideia", postagem: (body.postagem || "") + " (cópia)" };
  S.delPost = false; drawEditor(); toast("Cópia aberta. Ajuste e salve.");
}
async function copiarLegenda() {
  const t = $("#eLegenda").value;
  try { await navigator.clipboard.writeText(t); toast("Legenda copiada"); }
  catch (e) { $("#eLegenda").select(); toast("Selecionada. Use Ctrl+C."); }
}
function writeFail(e) {
  const c = e && e.code;
  if (c === "sessao") { S.token = ""; store("token", ""); S.eu = null; if ($("#dlg").open) $("#dlg").close(); render(); return toast("Sua sessão expirou. Entre de novo."); }
  const msg = c === "local" ? e.message
    : (c === "server" || c === "permissao") && e.message ? e.message
    : "Não foi possível salvar. Confira a internet e tente de novo.";
  toast(msg);
}

/* ---------- Eventos ---------- */
$("#marcaSel").addEventListener("change", e => { S.marcaId = e.target.value; store("marca", S.marcaId); S.month = null; S.f = { status: "", formato: "", produto: "", q: "" }; S.confirmDel = false; S.dirty = false; render(); });
$("#novaMarca").addEventListener("click", novaMarca);
addEventListener("hashchange", () => { S.confirmDel = false; S.delArq = null; S.dirty = false; render(); window.scrollTo(0, 0); });
document.addEventListener("input", e => { if (e.target.closest("#app form")) { S.dirty = true; const m = $("#app .save-bar .msg"); if (m) m.textContent = "Alterações não salvas"; } });
$("#dlg").addEventListener("close", () => render());
$("#agDlg").addEventListener("click", e => { if (e.target === $("#agDlg")) $("#agDlg").close(); });
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });

/* ---------- Planilha (Google Apps Script) ---------- */
const API = ((window.CONFIG && window.CONFIG.API_URL) || "").trim();
const VERSAO_SCRIPT = "2026-10-29.1"; // igual à VERSAO do Codigo.gs
async function api(action, payload = {}) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, token: S.token, site: location.origin + location.pathname, ...payload })
  });
  const j = await r.json();
  if (!j.ok) throw { code: j.code || "server", message: j.error || "" };
  return j;
}
async function carregar() {
  if (!API || !S.token) return render();
  try {
    const j = await api("listar");
    S.eu = j.eu; S.usuarios = j.usuarios || [];
    S.versao = j.versao || "antiga";
    S.marcas = (j.marcas || []).sort((a, b) => (a.criado || 0) - (b.criado || 0) || String(a.nome).localeCompare(b.nome));
    S.posts = (j.pautas || []).map(p => ({ ...p, status: normStatus(p.status) }));
    if (!S.marcas.find(m => m.id === S.marcaId)) { S.marcaId = S.marcas[0]?.id || null; S.month = null; }
    S.loadedM = S.loadedP = true; S.failed = false;
  } catch (e) {
    if (e.code === "sessao") return writeFail(e);
    if (!S.loadedP) S.failed = true; else toast("Sem conexão com a planilha agora.");
  }
  if (!$("#dlg").open && !$("#agDlg").open && !S.dirty && !S.rej && !S.uEdit && !S.boasVindas) render();
}
setInterval(() => { if (API && S.token && document.visibilityState === "visible" && !$("#dlg").open && !$("#agDlg").open) carregar(); }, 30000);
carregar();
render();
</script>
