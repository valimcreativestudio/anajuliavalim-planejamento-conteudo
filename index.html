function addPersona() {
  $("#semPersona")?.remove();
  $("#personas").insertAdjacentHTML("beforeend", personaHtml({}));
  $("#personas [data-persona]:last-child input").focus();
  S.dirty = true;
}

async function salvarPerfil(form, extra = {}) {
  const novo = { ...perfilDe(marca()) };
  const geral = form.querySelector("[data-geral]") || form;
  geral.querySelectorAll("[data-k]").forEach(el => { if (!el.closest("[data-persona]")) novo[el.dataset.k] = el.value.trim(); });
  if (form.querySelector("#personas")) {
    novo.personas = [...form.querySelectorAll("[data-persona]")].map(card => {
      const o = {}; card.querySelectorAll("[data-k]").forEach(el => o[el.dataset.k] = el.value.trim()); return o;
    }).filter(o => Object.values(o).some(cheio));
  }
  Object.assign(novo, extra);
  const btn = form.querySelector("button[type=submit]");
  if (btn) { btn.disabled = true; btn.textContent = "Salvando…"; }
  try {
    await api("salvarMarca", { marca: { ...marca(), perfil: novo } });
    S.dirty = false; await carregar(); toast("Salvo");
  } catch (e) { if (btn) { btn.disabled = false; btn.textContent = "Salvar"; } writeFail(e); }
}

const ext = a => ((a.nome || "").match(/\.([a-z0-9]{2,5})$/i) || [, ""])[1].toUpperCase();
function arquivoCard(a) {
  const did = a.driveId || driveId(a.url);
  const conf = S.delArq === a.id;
  return `<div class="file">
    <div class="prev">${ext(a) || esc((a.tipo || "").slice(0, 3).toUpperCase())}${did ? `<img src="https://drive.google.com/thumbnail?id=${esc(did)}&sz=w400" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
    <div class="info"><b>${esc(a.nome || "Sem nome")}</b><span class="muted" style="font-size:12px">${esc(a.tipo || "")}${a.data ? " · " + esc(brFull(a.data)) : ""}</span>${a.nota ? `<span style="font-size:12.5px">${esc(a.nota)}</span>` : ""}</div>
    <div class="acts">
      ${/^https?:\/\//.test(a.url || "") ? `<a class="btn sm" href="${esc(a.url)}" target="_blank" rel="noopener">Abrir</a><button class="btn sm" type="button" onclick="copiarTexto('${esc(a.url)}','Link copiado')">Copiar link</button>` : ""}
      ${S.canWrite ? (conf ? `<span class="confirm" style="font-size:12.5px">Remover? <button class="btn sm danger" type="button" onclick="removerArquivo('${esc(a.id)}')">Sim</button><button class="btn sm" type="button" onclick="S.delArq=null;render()">Não</button></span>`
        : `<button class="btn sm danger" type="button" onclick="S.delArq='${esc(a.id)}';render()">Remover</button>`) : ""}
    </div></div>`;
}

function lerBase64(file) {
  return new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = err; r.readAsDataURL(file); });
}
async function adicionarArquivo() {
  const file = $("#aFile").files[0], url = $("#aUrl").value.trim();
  if (!file && !url) return toast("Escolha um arquivo ou cole um link.");
  if (file && file.size > 25 * 1024 * 1024) return toast("Arquivo grande demais (máx. 25 MB). Envie pelo Drive e cole o link.");
  const btn = $("#aBtn"); btn.disabled = true;
  try {
    const item = { id: "a" + Date.now().toString(36), tipo: $("#aTipo").value, nome: $("#aNome").value.trim() || (file ? file.name : url), nota: $("#aNota").value.trim(), data: iso(new Date()), url };
    if (file) {
      btn.textContent = "Enviando…";
      const r = await api("enviarArquivo", { marcaId: S.marcaId, nome: file.name, mime: file.type || "application/octet-stream", base64: await lerBase64(file) });
      item.url = r.url; item.driveId = r.driveId;
      if (!$("#aNome").value.trim()) item.nome = file.name;
    }
    btn.textContent = "Salvando…";
    await api("salvarMarca", { marca: { ...marca(), arquivos: arquivosDe(marca()).concat(item) } });
    S.dirty = false; await carregar(); toast("Arquivo adicionado");
  } catch (e) { btn.disabled = false; btn.textContent = "Adicionar"; writeFail(e); }
}
async function removerArquivo(id) {
  try {
    await api("salvarMarca", { marca: { ...marca(), arquivos: arquivosDe(marca()).filter(a => a.id !== id) } });
    S.delArq = null; await carregar(); toast("Arquivo removido da lista");
  } catch (e) { writeFail(e); }
}

/* caixa de seleção múltipla: botão que abre a lista, marca vários e permite adicionar um item novo */
function msel(id, ops, marcados, vazio, phNovo, addFn) {
  const ro = !S.canWrite;
  return `<div class="msel" id="${id}" data-vazio="${esc(vazio)}">
    <button type="button" class="msel-btn" onclick="abrirMsel('${id}')" aria-haspopup="listbox"${ro ? " disabled" : ""}>${mselTexto(marcados, vazio)}</button>

      ${ops.length ? ops.map(x => mselOp(x, marcados.includes(x))).join("") : `<div class="msel-vazio">Nada cadastrado ainda.</div>`}
      ${ro ? "" : `<div class="msel-add"><input placeholder="${esc(phNovo)}" onkeydown="if(event.key==='Enter'){event.preventDefault();${addFn}}"><button class="btn sm primary" type="button" onclick="${addFn}">Adicionar</button></div>`}
    </div></div>`;
}
const mselOp = (x, on) => `<label class="msel-op"><input type="checkbox" value="${esc(x)}"${on ? " checked" : ""} onchange="mselAtualiza(this)"><span class="ck"></span><span class="nm">${esc(x)}</span></label>`;
function mselTexto(l, vazio) {
  return l.length ? `<span class="txt" title="${esc(l.join(", "))}">${esc(l.join(", "))}</span>${l.length > 1 ? `<span class="cnt">${l.length}</span>` : ""}` : `<span class="txt vazio">${esc(vazio)}</span>`;
}
function mselAtualiza(el) {
  const box = el.closest(".msel");
  box.querySelector(".msel-btn").innerHTML = mselTexto([...box.querySelectorAll(".msel-op input:checked")].map(i => i.value), box.dataset.vazio);
}
function abrirMsel(id) {
  const pop = $("#" + id + " .msel-pop"), abrir = pop.hidden;
  document.querySelectorAll(".msel-pop").forEach(p => p.hidden = true);
  pop.hidden = !abrir;
  // dentro de tabela (que rola de lado) a lista fica solta na tela para não ser cortada
  if (abrir && pop.closest(".table-wrap")) {
    const r = $("#" + id + " .msel-btn").getBoundingClientRect(), w = Math.max(r.width, 220);
    const alto = Math.min(280, pop.scrollHeight + 2), cabeBaixo = innerHeight - r.bottom > alto + 8;
    Object.assign(pop.style, { position: "fixed", width: w + "px", right: "auto", left: Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px",
      top: (cabeBaixo ? r.bottom + 4 : Math.max(8, r.top - alto - 4)) + "px" });
  }
}
// rolou a página: fecha as listas soltas
addEventListener("scroll", () => document.querySelectorAll(".table-wrap .msel-pop:not([hidden])").forEach(p => p.hidden = true), true);
function mselAdiciona(id, nome) {
  const box = $("#" + id), ja = [...box.querySelectorAll(".msel-op input")].find(i => i.value.toLowerCase() === nome.toLowerCase());

  box.querySelector(".msel-add input").value = "";

}
// fecha a lista ao clicar fora ou apertar Esc
document.addEventListener("click", e => { if (!e.target.closest(".msel")) document.querySelectorAll(".msel-pop").forEach(p => p.hidden = true); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && [...document.querySelectorAll(".msel-pop")].some(p => !p.hidden)) { e.preventDefault(); document.querySelectorAll(".msel-pop").forEach(p => p.hidden = true); } }, true);
async function addProdutoEditor() {

let EDIT = null;
function openEditor(id, date) {
  let m = marca();
  const p = id ? S.posts.find(x => x.id === id) : null;
  if (id && !p) return;
  if (p && p.marcaId !== S.marcaId) { S.marcaId = p.marcaId; store("marca", p.marcaId); S.canWrite = podeEditar(p.marcaId); render(); }
  m = marca();
  S.rejDlg = null;
  EDIT = p ? { ...p } : { status: "Ideia", data: date || (S.month + "-01"), formato: "Vídeo", fase: fasesDe(m)[0]?.nome || "", produto: "", rede: "Reels + TikTok" };
  // postagem nova já vem com prazos sugeridos: arte 5 dias antes e aprovação 2 dias antes do post
  if (!p) { EDIT.prazoArte = prazoPadrao(EDIT.data, 5); EDIT.prazoAprovacao = prazoPadrao(EDIT.data, 2); }
  S.delPost = false; S.repetir = false;
  drawEditor();
  $("#dlg").showModal();
}
function drawEditor() {
  const m = marca(), p = EDIT, ro = S.canWrite ? "" : " disabled";
  const sel = (id, arr, cur, free) => {
    const list = [...arr]; if (cur && !list.includes(cur)) list.push(cur);

function previaHtml(src) {

function atualizarPrevia() {

async function addRede() {

}
function midiasHtml(l) {

function trocarModoEditor(v) {

async function puxarPasta() {
  const link = $("#eCriativo").value.trim();
  if (!/folders\//.test(link)) return toast("Cole o link de uma pasta do Drive (drive.google.com/drive/folders/…).");
  const b = $("#btPasta"); b.disabled = true; b.textContent = "Lendo a pasta…";
  try {
    const r = await api("lerPasta", { link });
    EDIT.midias = r.midias || [];
    $("#eMidias").innerHTML = midiasHtml(EDIT.midias);
    $("#eMidiasBox").hidden = !EDIT.midias.length;
    $("#eMidiasBox > span").textContent = `Artes da publicação (${EDIT.midias.length})`;
    const primeira = EDIT.midias.find(x => x.tipo === "imagem") || EDIT.midias[0];
    if (primeira && !$("#eCapa").value.trim()) { $("#eCapa").value = `https://drive.google.com/file/d/${primeira.id}/view`; atualizarPrevia(); }
    // cabeçalho do documento (ex.: "P2 · Título (carrossel) · 01/11"): preenche o título e o formato se estiverem vazios
    if (r.cabecalho) {
      if (r.cabecalho.titulo && !$("#ePostagem").value.trim()) $("#ePostagem").value = r.cabecalho.titulo;
      if (r.cabecalho.formato && FORMATOS.includes(r.cabecalho.formato) && !EDIT.id) $("#eFormato").value = r.cabecalho.formato;
    }
    if (r.legenda) {
      if (!$("#eLegenda").value.trim()) $("#eLegenda").value = r.legenda;
      else if ($("#eLegenda").value.trim() !== r.legenda.trim()) {
        S.legPasta = r.legenda;
        $("#eLegNova").hidden = false;
        $("#eLegNova").innerHTML = `<div class="motivo" style="border-left-color:var(--st-produzido);background:var(--surface-2)"><b style="color:var(--ink)">Legenda do documento "${esc(r.docNome)}"</b>A legenda da postagem é diferente da do documento. <button class="btn sm" type="button" onclick="$('#eLegenda').value=S.legPasta;$('#eLegNova').hidden=true">Usar a do documento</button></div>`;
      }
    }
    S.dirty = true;
    toast(`${EDIT.midias.length} arte(s)${r.docNome ? " e a legenda" : ""} puxadas da pasta. Salve a postagem.`);
  } catch (e) { writeFail(e); }
  b.disabled = false; b.textContent = "Puxar da pasta";
}

async function salvarEditor(fechar = true) {

/* ---------- Fluxo de aprovação ---------- */
const ETAPAS = ["Ideia", "Em validação", "Em produção", "Em aprovação", "Aprovado", "Agendado", "Postado"];
const etapasDe = p => temClienteM(p.marcaId) ? ["Ideia", "Em validação", "Validação do cliente", "Em produção", "Em aprovação", "Aprovação do cliente", "Aprovado", "Agendado", "Postado"] : ETAPAS;

function fluxoHtml(p) {

    ${p.motivo ? `<div class="motivo"><b>${p.status === "Ideia reprovada" ? "Ideia reprovada" : "Ajustes pedidos"}</b>${esc(p.motivo)}</div>` : ""}
    ${p.agTipo && ["Agendado", "Postado"].includes(p.status) ? `<div class="kv" style="font-size:13.5px">⏰ <b>${esc(p.agTipo)}</b> agendado para ${esc(brFull(p.agData))} às ${esc(p.agHora)}${p.postLink ? ` · <a class="lnk" href="${esc(p.postLink)}" target="_blank" rel="noopener">Ver post publicado</a>` : ""}</div>` : ""}
    ${rej ? `<div class="rej"><label class="field"><span>${/eprovar/.test(rej) ? "Por que a ideia não foi aprovada?" : "Por que o conteúdo não foi aprovado? O que precisa mudar?"}</span><textarea id="rejMotivo" placeholder="Escreva o motivo para a social media ajustar"></textarea></label>
        <div class="row"><button class="btn danger" type="button" onclick="acaoEditor('${rej}')">Confirmar</button><button class="btn" type="button" onclick="S.rejDlg=null;drawEditor()">Cancelar</button></div></div>`
      : acoes.length ? `<div class="row">${acoes.map(k => {
          const a = ACOES[k];
          return a.motivo ? `<button class="btn danger" type="button" onclick="S.rejDlg='${k}';drawEditor();$('#rejMotivo').focus()">${esc(rotulo(k, p))}</button>`
            : `<button class="btn ${a.tipo === "ok" ? "ok" : "primary"}" type="button" onclick="acaoEditor('${k}')">${esc(rotulo(k, p))}</button>`;
        }).join("")}</div>` : `<span class="muted" style="font-size:13px">${COM_CLIENTE.includes(p.status) ? "Aguardando a aprovação do cliente." : p.status === "Em validação" || p.status === "Em aprovação" ? "Aguardando o aprovador." : p.status === "Postado" ? "Conteúdo publicado." : "Nenhuma ação sua nesta etapa."}</span>`}
    ${pubHtml(p)}
    ${p.id ? `<div class="row"><button class="btn sm" type="button" onclick="verNaGrade('${esc(p.id)}')">Ver na grade</button></div>` : ""}
    ${hist.length ? `<details><summary class="muted" style="cursor:pointer;font-size:13px">Histórico (${hist.length})</summary><ul class="hist">${hist.map(h => `<li>${new Date(h.em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })} · <b>${esc(h.por)}</b> ${esc((h.acao || "").toLowerCase())}${h.motivo ? `: "${esc(h.motivo)}"` : ""}</li>`).join("")}</ul></details>` : ""}
    ${p.id ? comentariosHtml(p, "editor") : ""}
  </div>`;

function editorMudou() {
  if (!EDIT.id) return true;
  if (!$("#eData")) return false; // tela "Instagram": nada foi editado
  const g = gather();
  // redes e produtos são listas: a ordem não importa
  const norm = (k, v) => k === "rede" ? redesDe(v).sort().join("|") : k === "produto" ? prodsDe(v).sort().join("|") : k === "midias" ? JSON.stringify((v || []).map(x => x.id)) : String(v ?? "").trim();
  return Object.keys(g).some(k => !["atualizado", "marcaId"].includes(k) && norm(k, g[k]) !== norm(k, EDIT[k]));
}
async function acaoEditor(k) {
  const a = ACOES[k];
  if (a.painel) {
    if (S.canWrite && editorMudou()) { const id = await salvarEditor(false); if (!id) return; }
    const id = EDIT.id; $("#dlg").close(); abrirAgenda(id, k); return;
  }
  const motivo = a.motivo ? ($("#rejMotivo")?.value || "").trim() : "";
  if (a.motivo && !motivo) return toast("Escreva o motivo.");
  // quem edita salva o que mudou antes de mandar para a próxima etapa
  if (a.quem === "editar" && S.canWrite && editorMudou()) { const id = await salvarEditor(false); if (!id) return; }
  await acao(EDIT.id, k, motivo);
  const p = S.posts.find(x => x.id === EDIT.id);
  if (p && $("#dlg").open) { EDIT = { ...p }; S.rejDlg = null; drawEditor(); }
}
async function acao(id, k, motivo = "", dados = {}) {

    toast(ACOES[k].ok);
  } catch (e) { writeFail(e); }
}

/* vídeo: toque para tocar/pausar, botão de som e barrinha de progresso, como no Instagram */
function igVideo(v) {
  const box = v && v.closest(".ig-video"); if (!box) return;
  // pausa os outros vídeos que estiverem tocando
  document.querySelectorAll(".ig-video video").forEach(o => { if (o !== v && !o.paused) { o.pause(); o.closest(".ig-video")?.classList.remove("tocando"); } });
  if (v.paused) { v.muted = box.dataset.som !== "1"; v.play().then(() => box.classList.add("tocando")).catch(() => igVideoErro(v)); }
  else { v.pause(); box.classList.remove("tocando"); }
}
function igSom(b) {
  const box = b.closest(".ig-video"), v = box.querySelector("video");
  const ligado = box.dataset.som !== "1"; box.dataset.som = ligado ? "1" : "0";
  if (v) v.muted = !ligado;
  b.textContent = ligado ? "🔊" : "🔇"; b.setAttribute("aria-label", ligado ? "Desligar o som" : "Ligar o som");
}
function igProgresso(v) {
  const box = v.closest(".ig-video"); if (!box) return;
  const i = box.querySelector(".ig-barra i");
  if (i && v.duration) i.style.width = (v.currentTime / v.duration * 100) + "%";
}
// se o Drive não entregar o vídeo direto (arquivo grande ou sem compartilhamento), usa o player do Drive
function igVideoErro(v) {
  const box = v.closest(".ig-video"); if (!box || box.dataset.iframe) return;
  box.dataset.iframe = "1";
  box.innerHTML = `<iframe src="https://drive.google.com/file/d/${esc(box.dataset.id)}/preview" allow="autoplay" allowfullscreen></iframe>`;
}
function igScroll(track) {
  const box = track.closest(".ig"), n = track.children.length, i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  const cnt = box.querySelector(".ig-cnt"); if (cnt) cnt.textContent = `${i + 1}/${n}`;
  box.querySelectorAll(".ig-dots i").forEach((d, k) => d.classList.toggle("on", k === i));
  const e = box.querySelector(".ig-seta.e"), d = box.querySelector(".ig-seta.d");
  if (e) e.hidden = i === 0; if (d) d.hidden = i >= n - 1;
}
function igPassar(btn, dir) {
  const t = btn.closest(".ig").querySelector(".ig-track");
  t.scrollBy({ left: dir * t.clientWidth, behavior: "smooth" });
}

// lidas por pessoa neste navegador; o que aconteceu depois da última abertura do sino conta como novo
const TIPOS_NOTIF = [
  ["Enviou a ideia", "💡", "", "aprovar"], ["Enviou o conteúdo", "↑", "", "aprovar"],
  ["Validou", "✓", "ok", "editar"], ["Aprovou", "✓", "ok", "editar"],
  ["Reprovou", "✕", "no", "editar"], ["Pediu ajustes", "✎", "no", "editar"],
  ["Agendou", "⏰", "", "todos"], ["Alterou o agendamento", "⏰", "", "todos"], ["Marcou como postado", "●", "ok", "todos"]
];
function notificacoes() {
  if (!S.eu) return [];
  const papel = S.eu.papel, chefia = ["admin", "diretor", "gestor"].includes(papel);
  const meu = h => h.uid ? h.uid === S.eu.id : h.por === S.eu.nome;
  const desde = Date.now() - 30 * 864e5, lista = [];
  S.posts.forEach(p => (p.historico || []).forEach(h => {
    if (!h.em || h.em < desde || meu(h)) return;
    const t = TIPOS_NOTIF.find(x => (h.acao || "").startsWith(x[0]));
    if (!t) return;
    // social media: o que voltou ou foi liberado nas marcas dela; aprovador: o que chegou para ele; chefia: tudo
    const serve = chefia || (papel === "cliente" ? COM_CLIENTE.includes(h.para) && temAcesso(p.marcaId)
      : t[3] === "aprovar" ? podeAprovar(p.marcaId) && papel === "aprovador" : t[3] === "editar" ? podeEditar(p.marcaId) && papel === "social" : false);
    if (serve) lista.push({ em: h.em, por: h.por, acao: h.acao, motivo: h.motivo, titulo: nm(p), marcaId: p.marcaId, ic: t[1], cls: t[2], abrir: `openEditor('${esc(p.id)}')` });
  }));
  // agenda: reunião marcada comigo, pedido para eu responder, resposta ao meu pedido
  (S.agenda || []).forEach(x => {
    if (x.tipo !== "reuniao" || x.atualizado < desde) return;
    const abrir = `location.hash='#agenda';setTimeout(()=>abrirEvento('${esc(x.id)}'),50)`;
    if (x.criadoPorId === S.eu.id) { if (["confirmada", "recusada"].includes(x.status) && x.decididoPor && x.decididoPor !== S.eu.nome) lista.push({ em: x.atualizado, por: x.decididoPor, acao: x.status === "recusada" ? "Recusou o seu pedido de reunião" : "Confirmou a reunião", motivo: x.motivo, titulo: x.titulo, ic: x.status === "recusada" ? "✗" : "📅", cls: x.status === "recusada" ? "danger" : "ok", abrir }); return; }
    if (x.status === "solicitada" && ehChefe()) lista.push({ em: x.criado, por: x.criadoPor, acao: "Pediu uma reunião", titulo: `${x.titulo} · ${br(x.data)} ${x.hora}`, ic: "🙋", cls: "", abrir });
    else if (x.status === "confirmada" && (x.participantes || []).includes(S.eu.id)) lista.push({ em: x.criado, por: x.criadoPor, acao: "Marcou uma reunião com você", titulo: `${x.titulo} · ${br(x.data)} ${x.hora}`, ic: "📅", cls: "", abrir });
  });
  // comentários de outras pessoas nas postagens que eu vejo
  S.posts.forEach(p => (p.comentarios || []).forEach(c => {
    if (c.em < desde || c.uid === S.eu.id || !temAcesso(p.marcaId)) return;
    lista.push({ em: c.em, por: c.por, acao: "Comentou" + (c.arte ? ` na arte ${c.arte}` : ""), motivo: c.texto, titulo: nm(p), marcaId: p.marcaId, ic: "💬", cls: "", abrir: `openEditor('${esc(p.id)}')` });
  }));
  // tarefas: o que passaram para mim e o que concluíram das que eu criei
  S.tarefas.forEach(t => {
    if (t.responsavelId === S.eu.id && t.criadoPorId !== S.eu.id && t.criado >= desde)
      lista.push({ em: t.criado, por: t.criadoPor, acao: "Te passou uma tarefa" + (t.prazo ? ` (até ${br(t.prazo)})` : ""), titulo: t.titulo, marcaId: t.marcaId, ic: "☐", cls: "", abrir: `abrirTarefa('${esc(t.id)}')` });
    if (t.criadoPorId === S.eu.id && t.status === "Feita" && t.concluidoPor && t.concluidoPor !== S.eu.nome && t.concluidoEm >= desde)
      lista.push({ em: t.concluidoEm, por: t.concluidoPor, acao: "Concluiu a tarefa", titulo: t.titulo, marcaId: t.marcaId, ic: "✓", cls: "ok", abrir: `abrirTarefa('${esc(t.id)}')` });
  });
  return lista.sort((a, b) => b.em - a.em).slice(0, 40);
}

  if (c === "sessao") { S.token = ""; store("token", ""); S.eu = null; if ($("#dlg").open) $("#dlg").close(); render(); return toast("Sua sessão expirou. Entre de novo."); }
  const msg = c === "local" ? e.message
    : (c === "server" || c === "permissao" || c === "insta") && e.message ? e.message
    : "Não foi possível salvar. Confira a internet e tente de novo.";
  toast(msg);
}

function vStories() {
  const m = marca(), perfil = perfilDe(m);
  const first = parse(S.month + "-01");
  const start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const end = new Date(last); end.setDate(last.getDate() + (6 - last.getDay()));
  const hoje = iso(new Date()), pode = S.canWrite;
  // faixa de bolinhas: hoje e os próximos 6 dias, como o topo do Instagram
  let topo = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const k = iso(d), l = storiesDia(k);
    const capa = l.find(x => storyMidiaId(x));
    const dentro = capa ? `<img src="https://drive.google.com/thumbnail?id=${esc(storyMidiaId(capa))}&sz=w160" alt="" onerror="this.remove()">` : l.length ? l.length : (pode ? "+" : "·");
    topo += `<button type="button" class="st-bolha${i === 0 ? " hoje" : ""}" onclick="${l.length ? `abrirStories('${k}',0)` : pode ? `novoStory('${k}')` : ""}" aria-label="${l.length} stories em ${br(k)}">
      ${anelHtml(l, dentro)}<small>${i === 0 ? "Hoje" : i === 1 ? "Amanhã" : WD[d.getDay()].slice(0, 3) + " " + d.getDate()}</small><b>${l.length ? l.length + (l.length === 1 ? " story" : " stories") : "—"}</b></button>`;
  }
  let cells = WD.map(d => `<div class="dow">${d.slice(0, 3)}</div>`).join("");
  let total = 0, dias = 0, postados = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = iso(d), l = storiesDia(k), out = d.getMonth() !== first.getMonth();
    if (!out) { total += l.length; if (l.length) dias++; postados += l.filter(x => x.status === "Postado").length; }
    cells += `<div class="sday${out ? " out" : ""}${k === hoje ? " today" : ""}" data-sdia="${k}">
      <div class="sh"><b>${d.getDate()}</b>${pode ? `<button class="add-day" type="button" aria-label="Novo story em ${br(k)}" onclick="novoStory('${k}')">+</button>` : ""}</div>
      ${l.length ? `<button type="button" class="sring" onclick="abrirStories('${k}',0)">${anelHtml(l, l.length)}<span class="t">${l.length === 1 ? "1 story" : l.length + " stories"}</span></button>
      <div class="minis">${l.slice(0, 6).map((x, i) => miniStory(x, "", `onclick="abrirStories('${k}',${i})"${pode ? ` draggable="true" data-sid="${esc(x.id)}"` : ""}`)).join("")}${l.length > 6 ? `<span class="smini mais">+${l.length - 6}</span>` : ""}</div>` : ""}

    `<div class="st-top" aria-label="Próximos dias">${topo}</div>
    <div class="st-cal">${cells}</div>
    <div class="st-leg"><span>${total} ${total === 1 ? "story" : "stories"} em ${esc(monthLabel(S.month))} · ${dias} ${dias === 1 ? "dia" : "dias"} com story · ${postados} postado${postados === 1 ? "" : "s"}</span>
      ${STATUS_STORY.map(s => `<span><i style="--sc:${stColorS(s)}"></i>${s}</span>`).join("")}</div>
    <p class="muted" style="font-size:13px;margin-top:6px">Clique na bolinha do dia para ver a sequência como no Instagram${pode ? ". Arraste um story para outro dia para mudar a data" : ""}.${perfil.instagram ? " Conta: " + esc(perfil.instagram) + "." : ""}</p>`;
}
function wireStories() {
  let arrastando = null;
  document.querySelectorAll(".smini[data-sid]").forEach(el => {
    el.addEventListener("dragstart", e => { arrastando = el.dataset.sid; e.dataTransfer.setData("text/plain", arrastando); e.dataTransfer.effectAllowed = "move"; });
  });
  document.querySelectorAll(".sday[data-sdia]").forEach(dia => {
    dia.addEventListener("dragover", e => { if (!arrastando) return; e.preventDefault(); dia.classList.add("drop"); });
    dia.addEventListener("dragleave", () => dia.classList.remove("drop"));
    dia.addEventListener("drop", async e => {
      e.preventDefault(); dia.classList.remove("drop");
      const id = arrastando; arrastando = null;
      const x = (S.stories || []).find(s => s.id === id), k = dia.dataset.sdia;
      if (!x || x.data === k) return;
      const fila = storiesDia(k).map(s => ({ id: s.id })).concat([{ id, data: k }]);
      x.data = k; x.ordem = fila.length; render();
      try { await api("ordenarStories", { ids: fila }); await carregar(); toast("Story movido para " + br(k)); } catch (err) { writeFail(err); carregar(); }
    });
  });
}

function stickerHtml(x) {
  const t = String(x.stickerTexto || "").trim(), partes = t.split(/\s+\/\s*|\s*\/\s+/).map(s => s.trim()).filter(Boolean);

    case "Enquete": case "Quiz": return `<div class="stk"><div class="card"><div class="q">${esc(partes[0] || "Sua pergunta")}</div><div class="ops"><span>${esc(partes[1] || "SIM")}</span><span>${esc(partes[2] || "NÃO")}</span></div></div></div>`;
    case "Caixinha de perguntas": return `<div class="stk"><div class="card"><div class="cx">${esc(t || "Faça uma pergunta")}</div><div>Digite algo…</div></div></div>`;
    case "Link": return `<div class="stk"><span class="pill">🔗 ${esc(t || (x.link || "").replace(/^https?:\/\//, "").slice(0, 28) || "Link")}</span></div>`;
    case "Contagem regressiva": return `<div class="stk"><div class="cd"><b>${esc(partes[0] || "Contagem")}</b><span>${esc(partes[1] || "00 : 00 : 00")}</span></div></div>`;

    case "Localização": return `<div class="stk"><span class="pill loc">📍 ${esc(t || "Localização")}</span></div>`;
    case "Slider de emoji": return `<div class="stk"><div class="card sl"><div class="q" style="padding:0">${esc(t || "Quanto você ama?")}</div><div></div></div></div>`;
    default: return "";
  }
}

function svTimer() {
  clearInterval(SV?.h);
  if (!SV) return;
  SV.h = setInterval(() => {
    if (!SV || !$("#stDlg").open) return clearInterval(SV?.h);
    if (SV.pausado) return;
    SV.t += 50;
    const bar = $("#svBar"); if (bar) bar.style.width = Math.min(100, SV.t / 50) + "%";
    if (SV.t >= 5000) {
      const l = storiesDia(SV.dia);
      if (SV.i < l.length - 1) { SV.i++; SV.t = 0; desenharSV(); }
      else { SV.t = 5000; SV.pausado = true; desenharSV(); }
    }
  }, 50);
}
function svIr(d) { const l = storiesDia(SV.dia); const n = SV.i + d; if (n < 0 || n >= l.length) return; SV.i = n; SV.t = 0; SV.pausado = false; desenharSV(); }
function svPausar() { SV.pausado = !SV.pausado; if (!SV.pausado && SV.t >= 5000) SV.t = 0; desenharSV(); const b = $("#svBar"); if (b) b.style.width = Math.min(100, SV.t / 50) + "%"; }
async function moverStory(id, d) {
  const l = storiesDia(SV.dia), i = l.findIndex(x => x.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  l.forEach((x, k) => x.ordem = k + 1);
  SV.i = j; desenharSV();
  try { await api("ordenarStories", { ids: l.map(x => ({ id: x.id })) }); carregar(); } catch (e) { writeFail(e); }
}
async function statusStory(id, status) {
  const x = S.stories.find(s => s.id === id); if (!x) return;
  try { await api("salvarStory", { story: { id, status } }); x.status = status; await carregar(); if (SV) desenharSV(); toast("Story " + status.toLowerCase()); } catch (e) { writeFail(e); }
}
async function publicarStory(id) {
  const b = $("#svPub"); if (b) { b.disabled = true; b.textContent = "Publicando…"; }
  try { await api("publicarAgora", { id, tipo: "story" }); toast("Story publicado no Instagram"); } catch (e) { writeFail(e); }

function redesenharComentarios(id, ctx) {
  if (ctx === "editor" && $("#dlg").open && EDIT && EDIT.id === id) {

async function comentar(id, ctx) {
  const ta = $(`#com-${ctx}-${id}`), texto = (ta?.value || "").trim();

  const arte = $(`#coma-${ctx}-${id}`)?.value || "";
  ta.disabled = true;
  try {
    const r = await api("comentar", { id, texto, arte });
    const p = S.posts.find(x => x.id === id); if (p) p.comentarios = (p.comentarios || []).concat([r.comentario]);
    S.dirty = false; redesenharComentarios(id, ctx); toast("Comentário enviado");
  } catch (e) { ta.disabled = false; writeFail(e); }

async function apagarComentario(id, cid, ctx) {
  try {
    await api("apagarComentario", { id, cid });

  } catch (e) { writeFail(e); }
}

/* ---------- Prazos de produção ---------- */
const ANTES_ARTE = ["Ideia", "Em validação", "Validação do cliente", "Ideia reprovada", "Em produção", "Ajustes solicitados"];
const JA_APROVADO = ["Aprovado", "Agendado", "Postado"];
function atrasoDe(p, h = hojeIso()) {
  if (p.status === "Postado") return null;
  if (p.data && p.data < h) return { tipo: "post", txt: "Data do post passou", dias: Math.round((parse(h) - parse(p.data)) / 864e5) };
  if (p.prazoArte && p.prazoArte < h && ANTES_ARTE.includes(p.status)) return { tipo: "arte", txt: "Arte atrasada", dias: Math.round((parse(h) - parse(p.prazoArte)) / 864e5) };
  if (p.prazoAprovacao && p.prazoAprovacao < h && !JA_APROVADO.includes(p.status)) return { tipo: "aprov", txt: "Aprovação atrasada", dias: Math.round((parse(h) - parse(p.prazoAprovacao)) / 864e5) };
  return null;
}
const prazoPadrao = (data, dias) => { if (!data) return ""; const d = parse(data); d.setDate(d.getDate() - dias); return iso(d); };
function atrasadosHtml() {
  const h = hojeIso();
  const l = S.posts.filter(p => podeEditar(p.marcaId) && atrasoDe(p, h) && p.data >= prazoPadrao(h, 30)).sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  if (!l.length) return "";
  return `<section class="tf-grupo atrasadas"><h2>Postagens atrasadas<span class="n">${l.length}</span></h2><div class="tf-lista">${l.slice(0, 30).map(p => { const a = atrasoDe(p, h); return `<div class="tf" style="--pc:var(--danger)"><span></span><div class="corpo" onclick="openEditor('${esc(p.id)}')"><div class="tt">${esc(nm(p))}</div>
      <div class="meta"><span>${esc(nomeMarca(p.marcaId))}</span><span>📅 post ${esc(br(p.data))}</span><span class="atraso">${esc(a.txt)} · ${a.dias} dia(s)</span><span>${esc(p.status)}</span></div></div><span class="prio">${esc(a.tipo === "arte" ? "Arte" : a.tipo === "aprov" ? "Aprovação" : "Post")}</span></div>`; }).join("")}</div></section>`;
}

/* ---------- Resultados dos posts (Instagram) ---------- */
function carregarMetricas(mid, mes, forcar) {
  const k = mid + "|" + mes;
  S.met[k] = { carregando: true };
  api("metricas", { marcaId: mid, mes, forcar: !!forcar })
    .then(r => { S.met[k] = r; })
    .catch(e => { S.met[k] = { erro: e.message || "Não consegui buscar os resultados." }; })
    .finally(() => { if (view() === "resumo") render(); });
}
function metricasHtml() {
  const m = marca();
  if (S.resumoTodas || !m) return "";
  if (!instaOk(m.id)) return `<div class="panel" style="margin-top:16px"><h2>Resultados dos posts</h2><p class="muted">Conecte o Instagram da marca em Marca → Configurações para ver curtidas, comentários, alcance e salvamentos de cada post aqui.</p></div>`;
  const k = m.id + "|" + S.month, r = S.met[k];
  if (!r) carregarMetricas(m.id, S.month);
  const fmt = v => v == null ? "—" : Number(v).toLocaleString("pt-BR");
  let corpo;
  if (!r || r.carregando) corpo = `<p class="muted">Buscando os resultados no Instagram…</p>`;
  else if (r.erro) corpo = `<p class="muted">${esc(r.erro)}</p>`;
  else if (!r.itens.length) corpo = `<p class="muted">Nenhum post deste mês com resultado ainda. Os resultados aparecem para os posts marcados como postados com o link do Instagram (ou publicados pelo sistema).</p>`;
  else {
    const linhas = r.itens.map(it => ({ ...it, p: S.posts.find(x => x.id === it.pautaId) })).filter(x => x.p).sort((a, b) => (a.p.data || "").localeCompare(b.p.data || ""));
    const soma = c => linhas.reduce((s, x) => s + (Number(x[c]) || 0), 0);
    const eng = x => x.alcance ? ((x.curtidas + x.comentarios + (x.salvos || 0) + (x.compart || 0)) / x.alcance * 100).toFixed(1).replace(".", ",") + "%" : "—";
    const melhor = linhas.slice().sort((a, b) => (b.curtidas + b.comentarios + (b.salvos || 0) * 2) - (a.curtidas + a.comentarios + (a.salvos || 0) * 2))[0];
    corpo = `<div class="met-kpis">${[["Curtidas", soma("curtidas")], ["Comentários", soma("comentarios")], ["Alcance", soma("alcance")], ["Salvamentos", soma("salvos")], ["Compartilhamentos", soma("compart")]].map(([l, v]) => `<div><b>${fmt(v)}</b><span>${l}</span></div>`).join("")}</div>
      ${melhor ? `<p style="margin:10px 0">⭐ Melhor post do mês: <b>${esc(nm(melhor.p))}</b> (${fmt(melhor.curtidas)} curtidas, ${fmt(melhor.salvos)} salvamentos)</p>` : ""}
      <div class="table-wrap"><table style="min-width:640px"><thead><tr><th>Post</th><th class="n">Curtidas</th><th class="n">Coment.</th><th class="n">Alcance</th><th class="n">Salvos</th><th class="n">Compart.</th><th class="n">Engaj.</th></tr></thead><tbody>
      ${linhas.map(x => `<tr><td><a class="lnk" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(br(x.p.data))} · ${esc(nm(x.p))}</a></td><td class="n">${fmt(x.curtidas)}</td><td class="n">${fmt(x.comentarios)}</td><td class="n">${fmt(x.alcance)}</td><td class="n">${fmt(x.salvos)}</td><td class="n">${fmt(x.compart)}</td><td class="n">${eng(x)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  return `<div class="panel" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Resultados dos posts</h2>${r && !r.carregando ? `<button class="btn sm" type="button" onclick="carregarMetricas(S.marcaId,S.month,true);render()">Atualizar</button>` : ""}</div>
    ${corpo}${r && r.semLink ? `<p class="muted" style="font-size:12.5px;margin-top:8px">${r.semLink} post(s) postado(s) sem o link do Instagram: abra a postagem e cole o link em "Marcar como postado" para entrar aqui.</p>` : ""}</div>`;
}

function pascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);

  const l = DATAS_FIXAS.map(([m, d, nome, n]) => [iso(new Date(ano, m - 1, d)), nome, n]);

  const ultSexta = (() => { const d = new Date(ano, 11, 0); while (d.getDay() !== 5) d.setDate(d.getDate() - 1); return d; })();
  l.push([mais(p, -47), "Carnaval", ""], [mais(p, -2), "Sexta-feira Santa (feriado)", ""], [iso(p), "Páscoa", ""], [mais(p, 60), "Corpus Christi", ""],
    [iso(nDomingo(ano, 5, 2)), "Dia das Mães", ""], [iso(nDomingo(ano, 8, 2)), "Dia dos Pais", ""], [iso(ultSexta), "Black Friday", ""], [mais(ultSexta, 3), "Cyber Monday", "tecnologia moda beleza"]);
  return l;
}
function datasComemorativas(m) {

  [ano - 1, ano, ano + 1].forEach(a => datasDoAno(a).forEach(([k, nome, n]) => {

}

/* ---------- Tempo de aprovação ---------- */
const ENVIOS_EQUIPE = /^Enviou (a ideia para validação|o conteúdo para aprovação)/;
function temposAprovacao(posts) {
  // espera da equipe: do envio até o aprovador decidir; espera do cliente: de chegar no cliente até ele decidir
  const eq = {}, cli = {}, pess = {};
  const add = (o, k, dias) => { (o[k] ||= []).push(dias); };
  posts.forEach(p => {
    const h = (p.historico || []).slice().sort((a, b) => a.em - b.em);
    h.forEach((x, i) => {
      if (ENVIOS_EQUIPE.test(x.acao || "")) {
        const dec = h.slice(i + 1).find(y => ["Em validação", "Em aprovação"].includes(y.de));
        if (dec) { const d = (dec.em - x.em) / 864e5; add(eq, p.marcaId, d); add(pess, dec.por || "?", d); }
      }
      if (COM_CLIENTE.includes(x.para)) {
        const dec = h.slice(i + 1).find(y => COM_CLIENTE.includes(y.de));
        if (dec) add(cli, p.marcaId, (dec.em - x.em) / 864e5);
      }
    });
  });
  return { eq, cli, pess };
}
function temposHtml(posts) {
  const t = temposAprovacao(posts), med = l => l && l.length ? l.reduce((a, b) => a + b, 0) / l.length : null;
  const fmt = d => d == null ? "—" : d < 1 ? Math.max(1, Math.round(d * 24)) + " h" : d.toFixed(1).replace(".", ",") + " dias";
  const marcas = [...new Set(Object.keys(t.eq).concat(Object.keys(t.cli)))];
  if (!marcas.length) return "";
  const pess = Object.entries(t.pess).sort((a, b) => med(b[1]) - med(a[1]));
  return `<div class="panel" style="margin-top:16px"><h2>Tempo de aprovação</h2><p class="muted" style="margin:-4px 0 10px;font-size:13px">Média entre enviar e receber a resposta, nos posts deste período.</p>
    <div class="table-wrap"><table style="min-width:420px"><thead><tr><th>Marca</th><th class="n">Equipe (aprovador)</th><th class="n">Cliente</th><th class="n">Aprovações</th></tr></thead><tbody>
    ${marcas.map(id => `<tr><td>${esc(nomeMarca(id))}</td><td class="n">${fmt(med(t.eq[id]))}</td><td class="n${med(t.cli[id]) > 3 ? " atraso" : ""}">${fmt(med(t.cli[id]))}</td><td class="n">${(t.eq[id] || []).length + (t.cli[id] || []).length}</td></tr>`).join("")}</tbody></table></div>
    ${pess.length ? `<p style="font-size:13px;margin:10px 0 0">Por aprovador: ${pess.map(([n, l]) => `<b>${esc(n)}</b> ${fmt(med(l))} (${l.length})`).join(" · ")}</p>` : ""}</div>`;
}

    corpo = `${r.top.length ? `<p style="margin:0 0 10px">Melhores momentos: ${r.top.map((t, i) => `<b>${i + 1}. ${WD[t.dia]} ${FAIXAS_TXT[t.faixa]}</b>`).join(" · ")}</p>` : ""}

function agMesHtml() {
  const ym = S.agDia.slice(0, 7), first = parse(ym + "-01"), start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0), end = new Date(last); end.setDate(last.getDate() + (6 - last.getDay()));
  let cells = WD.map(d => `<div class="dow">${d}</div>`).join(""), hoje = hojeIso();
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = iso(d), l = eventosDia(k), t = tarefasDia(k);
    cells += `<div class="day${d.getMonth() !== first.getMonth() ? " out" : ""}${k === hoje ? " today" : ""}" onclick="if(!event.target.closest('button'))novoEvento('atividade','${k}')"><div class="dhead"><span class="dnum"><b>${d.getDate()}</b></span></div>
      ${l.map(x => blocoEvento(x)).join("")}${t.map(x => `<button type="button" class="ev-tf" onclick="abrirTarefa('${esc(x.id)}')">☐ ${esc(x.titulo)}</button>`).join("")}</div>`;
  }
  return `<div class="cal ag-mes">${cells}</div>`;
}
function agListaHtml(dias) {
  const hoje = hojeIso();
  return `<div class="ag-lista">${dias.map(k => { const l = eventosDia(k), t = tarefasDia(k); return `<section class="ag-dia${k === hoje ? " hoje" : ""}"><h3>${esc(WD[parse(k).getDay()])}, ${br(k)}${k === hoje ? " · hoje" : ""}<button class="btn sm" type="button" onclick="novoEvento('atividade','${k}')">+</button></h3>
    ${l.length || t.length ? l.map(x => blocoEvento(x)).join("") + t.map(x => `<button type="button" class="ev-tf" onclick="abrirTarefa('${esc(x.id)}')">☐ ${esc(x.titulo)}</button>`).join("") : `<span class="muted" style="font-size:13px">Livre</span>`}</section>`; }).join("")}</div>`;
}
function rsvpBtns(x) {
  const r = (x.respostas || {})[S.eu.id];
  return [["sim", "Vou"], ["talvez", "Talvez"], ["nao", "Não vou"]].map(([k, l]) => `<button class="btn sm${r === k ? (k === "sim" ? " ok" : k === "nao" ? " danger" : " primary") : ""}" type="button" onclick="responderEvento('${esc(x.id)}','${k}')">${l}</button>`).join("");
}
function pedidoHtml(x) {
  const rej = S.agRej === x.id, conf = conflitos(x);
  return `<div class="ag-card" style="--c:${corEvento(x)}"><div><b>${esc(x.titulo)}</b><div class="muted">${esc(x.criadoPor)} pediu para ${esc(wd(x.data)).toLowerCase()}, ${br(x.data)} às ${esc(x.hora)} · ${durTxt(x.duracao)}${(x.participantes || []).length > 1 ? ` · com ${esc(x.participantes.map(nomePessoa).filter(Boolean).join(", "))}` : ""}</div>
    ${x.descricao ? `<div style="font-size:13.5px;margin-top:4px">${esc(x.descricao)}</div>` : ""}${conf.length ? `<div class="atraso" style="font-size:12.5px;margin-top:4px">⚠ Você já tem ${esc(conf.map(y => y.titulo).join(", "))} neste horário</div>` : ""}</div>
    <div class="ag-acts">${rej ? `<input id="agRejTxt" placeholder="Motivo ou outro horário sugerido" style="min-width:200px"><button class="btn sm danger" type="button" onclick="responderEvento('${esc(x.id)}','recusar')">Recusar</button><button class="btn sm" type="button" onclick="S.agRej=null;render()">Voltar</button>`
      : S.agAce === x.id ? `<input id="agAceData" type="date" value="${esc(x.data)}"><input id="agAceHora" type="time" value="${esc(x.hora)}"><button class="btn sm ok" type="button" onclick="responderEvento('${esc(x.id)}','aceitar')">Confirmar</button><button class="btn sm" type="button" onclick="S.agAce=null;render()">Voltar</button>`
      : `<button class="btn sm ok" type="button" onclick="responderEvento('${esc(x.id)}','aceitar')">Aceitar</button><button class="btn sm" type="button" onclick="S.agAce='${esc(x.id)}';render()">Aceitar em outro horário</button><button class="btn sm danger" type="button" onclick="S.agRej='${esc(x.id)}';render();$('#agRejTxt').focus()">Recusar</button>`}</div></div>`;
}
async function responderEvento(id, resposta) {
  const dados = {}; let motivo = "";
  if (resposta === "recusar") { motivo = ($("#agRejTxt")?.value || "").trim(); if (!motivo) return toast("Escreva o motivo ou sugira outro horário."); }
  if (resposta === "aceitar" && S.agAce === id) { dados.data = $("#agAceData").value; dados.hora = $("#agAceHora").value; }
  try {
    await api("responderEvento", { id, resposta, motivo, dados });
    S.agRej = S.agAce = null; await carregar();
    toast({ aceitar: "Reunião confirmada", recusar: "Pedido recusado", sim: "Presença confirmada", talvez: "Respondido: talvez", nao: "Respondido: não vou" }[resposta]);
    if ($("#evDlg").open) { const x = S.agenda.find(e => e.id === id); if (x) desenharEvento(x, false); }
  } catch (e) { writeFail(e); }
}
/* diálogo: ver ou criar */
let EV = null;
function novoEvento(tipo, dia, hora) {
  EV = { tipo, data: dia || (S.agDia && S.agDia >= hojeIso() ? S.agDia : hojeIso()), hora: hora || "10:00", duracao: tipo === "reuniao" ? 60 : 60, titulo: "", participantes: [], local: "", descricao: "", cor: "" };
  desenharEvento(EV, true); $("#evDlg").showModal(); setTimeout(() => $("#evTitulo")?.focus(), 30);
}
function abrirEvento(id) {
  const x = S.agenda.find(e => e.id === id); if (!x) return;
  EV = JSON.parse(JSON.stringify(x));
  const pode = x.criadoPorId === S.eu.id || (x.tipo === "reuniao" && ehChefe());
  desenharEvento(EV, false, pode);
  $("#evDlg").showModal();
}
function linkGoogleAgenda(x) {
  const [y, mo, d] = x.data.split("-").map(Number), [hh, mm] = x.hora.split(":").map(Number);
  const ini = new Date(y, mo - 1, d, hh, mm), fim = new Date(ini.getTime() + (+x.duracao || 60) * 60000);
  const f = t => t.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(x.titulo)}&dates=${f(ini)}/${f(fim)}&details=${encodeURIComponent(x.descricao || "")}&location=${encodeURIComponent(x.local || "")}`;
}
function desenharEvento(x, editar, podeEditarEv) {
  const novo = !x.id, reun = x.tipo === "reuniao";
  if (editar) {
    const pessoas = S.equipe.filter(u => u.id !== S.eu.id && u.papel !== "cliente").sort((a, b) => a.nome.localeCompare(b.nome));
    const conf = x.data && x.hora ? conflitos(x) : [];
    $("#evForm").innerHTML = `<div class="dlg-head"><div><div class="muted" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600">Agenda</div>
      <h2>${novo ? (reun ? (ehChefe() ? "Marcar reunião" : "Pedir reunião") : "Nova atividade") : "Editar"}</h2></div><button class="icon-btn x" type="button" aria-label="Fechar" onclick="$('#evDlg').close()">×</button></div>
    <div class="dlg-body" style="grid-template-columns:1fr 1fr">
      ${novo ? `<div class="field full"><span>Tipo</span><div class="seg"><label><input type="radio" name="evTipo" value="reuniao"${reun ? " checked" : ""} onchange="lerEvento();EV.tipo='reuniao';desenharEvento(EV,true)"><span>Reunião</span></label><label><input type="radio" name="evTipo" value="atividade"${reun ? "" : " checked"} onchange="lerEvento();EV.tipo='atividade';desenharEvento(EV,true)"><span>Atividade minha</span></label></div></div>` : ""}
      ${reun && !ehChefe() ? `<div class="full motivo" style="border-left-color:var(--s-cliente);background:var(--surface-2)"><b style="color:var(--ink)">Vai como pedido</b>A reunião só entra na agenda de todos quando alguém da gestão aceitar.</div>` : ""}
      <label class="field full"><span>${reun ? "Assunto" : "O que você vai fazer"}</span><input id="evTitulo" required value="${esc(x.titulo)}" placeholder="${reun ? "Ex.: Alinhamento do conteúdo de dezembro" : "Ex.: Gravar os reels da Liso"}"></label>
      <label class="field"><span>Dia</span><input id="evData" type="date" required value="${esc(x.data)}" onchange="lerEvento();desenharEvento(EV,true)"></label>
      <label class="field"><span>Horário</span><input id="evHora" type="time" required value="${esc(x.hora)}" onchange="lerEvento();desenharEvento(EV,true)"></label>
      <div class="field full"><span>Duração</span><div class="seg">${DURACOES.map(m => `<label><input type="radio" name="evDur" value="${m}"${+x.duracao === m ? " checked" : ""} onchange="lerEvento();desenharEvento(EV,true)"><span>${durTxt(m)}</span></label>`).join("")}</div>
        <small>Termina às ${horaDe(minDe(x.hora) + (+x.duracao || 60))}.</small></div>
      ${conf.length ? `<div class="full atraso" style="font-size:13px">⚠ Nesse horário você já tem: ${esc(conf.map(y => `${y.hora} ${y.titulo}`).join(", "))}</div>` : ""}
      ${reun ? `<div class="field full"><span id="evPartN">Participantes (${(x.participantes || []).length})</span>
        <input id="evBusca" placeholder="Buscar pessoa…" oninput="document.querySelectorAll('#evPessoas label').forEach(l=>l.hidden=!l.textContent.toLowerCase().includes(this.value.toLowerCase()))" style="border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;color:var(--ink)">
        <div class="ev-pessoas" id="evPessoas">${pessoas.map(u => `<label><input type="checkbox" value="${esc(u.id)}"${(x.participantes || []).includes(u.id) ? " checked" : ""} onchange="lerEvento();$('#evPartN').textContent='Participantes ('+EV.participantes.length+')'">${avatarHtml(u, 24)}<span>${esc(u.nome)}<small>${esc(PAPEIS[u.papel] || "")}</small></span></label>`).join("")}</div></div>
        <label class="field full"><span>Local ou link (Meet, Zoom…)</span><input id="evLocal" value="${esc(x.local)}" placeholder="https://meet.google.com/…"></label>` : ""}
      <label class="field full"><span>${reun ? "Pauta / o que vai ser falado" : "Detalhes"}</span><textarea id="evDesc" rows="3">${esc(x.descricao)}</textarea></label>
      <div class="field full"><span>Cor</span><div class="cores">${["", "#1e88e5", "#43a047", "#f2b705", "#ff7a00", "#e53935", "#d81b60", "#8e24aa", "#546e7a"].map(c => `<label style="--c:${c || (reun ? "var(--s-reuniao)" : "var(--s-atividade)")}" title="${c ? c : "Padrão"}"><input type="radio" name="evCor" value="${c}"${(x.cor || "") === c ? " checked" : ""} aria-label="${c || "Cor padrão"}"></label>`).join("")}</div></div>
    </div>
    <div class="dlg-foot">${!novo ? `<button class="btn danger" type="button" onclick="excluirEvento()">${reun ? "Cancelar reunião" : "Excluir"}</button>` : ""}<span class="sp"></span>
      <button class="btn" type="button" onclick="${novo ? "$('#evDlg').close()" : "desenharEvento(EV,false,true)"}">Voltar</button>
      <button class="btn primary" type="submit" id="evSalvar">${reun ? (ehChefe() ? (novo ? "Marcar reunião" : "Salvar") : "Enviar pedido") : "Salvar"}</button></div>`;
    return;
  }
  // visualização
  const resp = x.respostas || {}, partes = [{ id: x.criadoPorId, nome: x.criadoPor, org: true }].concat((x.participantes || []).map(id => ({ id, nome: nomePessoa(id) || "?" })));
  const ROT = { sim: "✓ vai", nao: "✗ não vai", talvez: "? talvez" };
  $("#evForm").innerHTML = `<div class="dlg-head"><div><div class="muted" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600">${reun ? (x.status === "solicitada" ? "Pedido de reunião" : x.status === "recusada" ? "Pedido recusado" : "Reunião") : "Atividade"}</div>
    <h2>${esc(x.titulo)}</h2></div><button class="icon-btn x" type="button" aria-label="Fechar" onclick="$('#evDlg').close()">×</button></div>
    <div class="dlg-body" style="grid-template-columns:1fr">
      <div class="ev-info" style="--c:${corEvento(x)}"><div>📅 <b>${esc(wd(x.data))}, ${brFull(x.data)}</b> · ${esc(x.hora)}–${horaDe(minDe(x.hora) + (+x.duracao || 60))} (${durTxt(x.duracao)})</div>
        ${x.local ? `<div>📍 ${/^https?:/.test(x.local) ? `<a class="lnk" href="${esc(x.local)}" target="_blank" rel="noopener">${esc(x.local)}</a>` : esc(x.local)}</div>` : ""}
        ${x.status === "recusada" ? `<div class="motivo"><b>Recusado por ${esc(x.decididoPor)}</b>${esc(x.motivo)}</div>` : ""}
        ${x.descricao ? `<div class="rot" style="white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px">${esc(x.descricao)}</div>` : ""}</div>
      ${reun ? `<div><b style="font-size:14px">Participantes</b><ul class="ev-lista">${partes.map(p => { const u = S.equipe.find(e => e.id === p.id) || p; return `<li>${avatarHtml(u, 26)}<span>${esc(p.nome)}${p.org ? ` <small class="muted">· marcou</small>` : ""}</span><small class="${resp[p.id] === "nao" ? "atraso" : "muted"}">${p.org ? "" : esc(ROT[resp[p.id]] || "sem resposta")}</small></li>`; }).join("")}</ul></div>` : ""}
      ${reun && x.status === "confirmada" && (x.participantes || []).includes(S.eu.id) && x.criadoPorId !== S.eu.id ? `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b style="font-size:14px">Você vai?</b>${rsvpBtns(x)}</div>` : ""}
      ${reun && x.status === "solicitada" && ehChefe() && x.criadoPorId !== S.eu.id ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" type="button" onclick="responderEvento('${esc(x.id)}','aceitar')">Aceitar pedido</button><button class="btn" type="button" onclick="$('#evDlg').close();location.hash='#agenda'">Responder na agenda</button></div>` : ""}
      ${x.status === "confirmada" ? `<a class="lnk" href="${esc(linkGoogleAgenda(x))}" target="_blank" rel="noopener" style="font-size:13.5px">Adicionar ao meu Google Agenda</a>` : ""}
    </div>
    <div class="dlg-foot"><span class="muted" style="font-size:12.5px">${reun ? `Marcada por ${esc(x.criadoPor)}${x.decididoPor && x.decididoPor !== x.criadoPor && x.status === "confirmada" ? ` · aceita por ${esc(x.decididoPor)}` : ""}` : ""}</span><span class="sp"></span>
      ${podeEditarEv ? `<button class="btn primary" type="button" onclick="${x.status === "recusada" ? "EV.status='';" : ""}desenharEvento(EV,true)">${x.status === "recusada" ? "Pedir de novo" : "Editar"}</button>` : ""}
      <button class="btn" type="button" onclick="$('#evDlg').close()">Fechar</button></div>`;
}
function lerEvento() {
  const v = id => ($("#" + id)?.value ?? "");
  Object.assign(EV, { titulo: v("evTitulo").trim(), data: v("evData"), hora: v("evHora"), local: v("evLocal").trim(), descricao: v("evDesc"),
    duracao: +(($("#evForm input[name=evDur]:checked") || {}).value || EV.duracao), cor: ($("#evForm input[name=evCor]:checked") || {}).value ?? EV.cor });
  if ($("#evPessoas")) EV.participantes = [...document.querySelectorAll("#evPessoas input:checked")].map(i => i.value);
}
$("#evForm").addEventListener("submit", async e => {
  e.preventDefault(); if (!$("#evTitulo")) return;
  lerEvento();
  if (!EV.titulo) return toast("Escreva o assunto.");
  if (EV.tipo === "reuniao" && !EV.participantes.length) return toast("Escolha quem participa.");
  const b = $("#evSalvar"); b.disabled = true; b.textContent = "Salvando…";
  try {
    await api("salvarEvento", { evento: EV });
    const pedido = EV.tipo === "reuniao" && !ehChefe();
    S.agDia = EV.data; $("#evDlg").close(); await carregar();
    toast(pedido ? "Pedido enviado para a gestão" : EV.tipo === "reuniao" ? "Reunião marcada. Os participantes recebem o convite por e-mail." : "Atividade salva");
  } catch (err) { b.disabled = false; b.textContent = "Salvar"; writeFail(err); }
});
async function excluirEvento() {
  if (!confirm(EV.tipo === "reuniao" ? "Cancelar esta reunião? Os participantes recebem um aviso." : "Excluir esta atividade?")) return;
  try { await api("excluirEvento", { id: EV.id }); $("#evDlg").close(); await carregar(); toast(EV.tipo === "reuniao" ? "Reunião cancelada" : "Atividade excluída"); } catch (e) { writeFail(e); }
}
$("#evDlg").addEventListener("click", e => { if (e.target === $("#evDlg")) $("#evDlg").close(); });
$("#evDlg").addEventListener("close", () => { EV = null; render(); });

/* ---------- Eventos ---------- */
$("#marcaSel").addEventListener("change", e => { S.marcaId = e.target.value; store("marca", S.marcaId); S.month = null; S.f = { status: "", formato: "", produto: "", q: "" }; S.confirmDel = false; S.dirty = false; render(); });
$("#novaMarca").addEventListener("click", novaMarca);
addEventListener("hashchange", () => { S.confirmDel = false; S.delArq = null; S.dirty = false; render(); window.scrollTo(0, 0); });
document.addEventListener("input", e => { if (e.target.closest("#app form")) { S.dirty = true; const m = $("#app .save-bar .msg"); if (m) m.textContent = "Alterações não salvas"; } });
$("#dlg").addEventListener("close", () => render());
$("#tfDlg").addEventListener("close", () => { S.delTarefa = false; render(); });
$("#grDlg").addEventListener("click", e => { if (e.target === $("#grDlg")) $("#grDlg").close(); });
$("#grDlg").addEventListener("close", () => { S.gradeDlg = null; });
$("#tfDlg").addEventListener("click", e => { if (e.target === $("#tfDlg")) $("#tfDlg").close(); });
$("#agDlg").addEventListener("click", e => { if (e.target === $("#agDlg")) $("#agDlg").close(); });
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });

/* ---------- Planilha (Google Apps Script) ---------- */
const API = ((window.CONFIG && window.CONFIG.API_URL) || "").trim();
const VERSAO_SCRIPT = "2026-11-05.1"; // igual à VERSAO do Codigo.gs
async function api(action, payload = {}) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, token: S.token, site: location.origin + location.pathname, ...payload })
  });
  const j = await r.json();
  if (!j.ok) throw { code: j.code || "server", message: j.error || "" };
  return j;
}
async function carregar() {
  if (!API || !S.token) return render();
  try {
    if (!S.desde) S.desde = shiftMonth(iso(new Date()).slice(0, 7), -3);
    const j = await api("listar", { desde: S.desde, se: S.carimbo });
    if (j.igual) { S.versao = j.versao || S.versao; return; }
    S.carimbo = j.carimbo || "";
    S.stories = j.stories || []; S.agenda = j.agenda || [];
    S.eu = j.eu; S.usuarios = j.usuarios || []; S.tarefas = j.tarefas || []; S.equipe = j.equipe || [];
    S.versao = j.versao || "antiga";
    S.marcas = (j.marcas || []).sort((a, b) => (a.criado || 0) - (b.criado || 0) || String(a.nome).localeCompare(b.nome));
    S.posts = (j.pautas || []).map(p => ({ ...p, status: normStatus(p.status) }));
    if (!S.marcas.find(m => m.id === S.marcaId)) { S.marcaId = S.marcas[0]?.id || null; S.month = null; }
    S.loadedM = S.loadedP = true; S.failed = false;
    if (S.eu) { store("cores", JSON.stringify(S.eu.cores || {})); aplicarCores(S.eu.cores || {}); }
    avisarNovidades();
  } catch (e) {
    if (e.code === "sessao") return writeFail(e);
    if (!S.loadedP) S.failed = true; else toast("Sem conexão com a planilha agora.");
  }
  if (!$("#dlg").open && !$("#agDlg").open && !$("#tfDlg").open && !S.dirty && !S.rej && !S.uEdit && !S.boasVindas && !document.querySelector(".msel-pop:not([hidden])")) render();
}
// link do cliente: #entrar=<chave> já entra na conta, sem senha
if (location.hash.startsWith("#entrar=")) {
  const t = location.hash.slice(8).replace(/[^\w]/g, "");
  if (t) { S.token = t; store("token", t); }
  history.replaceState(null, "", location.pathname + location.search + "#aprovacoes");
}
setInterval(() => { if (API && S.token && document.visibilityState === "visible" && !$("#dlg").open && !$("#agDlg").open && !$("#tfDlg").open) carregar(); }, 30000);
aplicarCores();
carregar();
render();
</script>
