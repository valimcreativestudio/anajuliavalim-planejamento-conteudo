<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planejamento de Conteúdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: faixa de cabeçalho escura com marca + abas; abaixo, a visão ativa (calendário, pautas, fluxo, grade, resumo, marca) */
:root {
  --bg: #F5F5F3;
  --surface: #FFFFFF;
  --surface-2: #EDEDEA;
  --ink: #1D1D1F;
  --muted: #6E6E73;
  --line: #E0E0DC;
  --vinho: #26262A;
  --primary: #26262A;
  --primary-ink: #F5F5F3;
  --vinho-ink: #F5F5F3;
  --verde: #6B7470;
  --caramelo: #55555B;
  --manteiga: #D6D6D2;
  --danger: #B3362F;
  --st-ideia: #9A9A9E;
  --st-validado: #A08A5C;
  --st-produzido: #5F7891;
  --st-aprovado: #7E7096;
  --st-agendado: #946672;
  --st-postado: #5F7D66;
  --shadow: 0 10px 30px rgba(20, 20, 22, .12);
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141415; --surface: #1E1E20; --surface-2: #27272A; --ink: #EDEDEB; --muted: #A1A1A6; --line: #333336;
    --vinho: #2A2A2E; --vinho-ink: #F0F0EE; --primary: #EDEDEB; --primary-ink: #141415; --verde: #A3ABA7; --caramelo: #B8B8BD; --manteiga: #45454A; --danger: #EE7B70;
    --st-ideia: #A1A1A6; --st-validado: #CDB98E; --st-produzido: #96AFC8; --st-aprovado: #B2A6CC; --st-agendado: #C99BA7; --st-postado: #98B5A0;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141415; --surface: #1E1E20; --surface-2: #27272A; --ink: #EDEDEB; --muted: #A1A1A6; --line: #333336;
  --vinho: #2A2A2E; --vinho-ink: #F0F0EE; --primary: #EDEDEB; --primary-ink: #141415; --verde: #A3ABA7; --caramelo: #B8B8BD; --manteiga: #45454A; --danger: #EE7B70;
  --st-ideia: #A1A1A6; --st-validado: #CDB98E; --st-produzido: #96AFC8; --st-aprovado: #B2A6CC; --st-agendado: #C99BA7; --st-postado: #98B5A0;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--vinho); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--caramelo); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }

/* Cabeçalho */
header.top { background: var(--vinho); color: var(--vinho-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px 0; }
.brand { font-family: var(--f-display); font-size: 26px; line-height: 1; letter-spacing: .01em; white-space: nowrap; }
.brand em { color: color-mix(in srgb, var(--vinho-ink) 62%, transparent); }
.marca-pick { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.marca-pick select { background: transparent; border: 1px solid color-mix(in srgb, var(--vinho-ink) 40%, transparent); color: var(--vinho-ink); border-radius: 999px; padding: 6px 12px; max-width: 220px; }
.marca-pick select option { color: #1D1D1F; background: #fff; }
.ghost-light { background: transparent; border: 1px solid color-mix(in srgb, var(--vinho-ink) 40%, transparent); color: var(--vinho-ink); border-radius: 999px; padding: 6px 12px; }
.ghost-light:hover { background: color-mix(in srgb, var(--vinho-ink) 12%, transparent); }
nav.tabs { flex-basis: 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { color: color-mix(in srgb, var(--vinho-ink) 72%, transparent); text-decoration: none; padding: 10px 14px 11px; border-radius: 10px 10px 0 0; white-space: nowrap; font-weight: 500; }
nav.tabs a:hover { color: var(--vinho-ink); }
nav.tabs a[aria-current="page"] { background: var(--bg); color: var(--ink); }

main { padding-block: 22px 60px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px; margin-bottom: 18px; }
.view-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4vw, 42px); line-height: 1; margin: 0; text-wrap: balance; }
.view-head h1 small { display: block; font-family: var(--f-body); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.view-head .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--caramelo); }
a.btn { text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.15); }
:root:not([data-theme="light"]) .btn.primary:hover { filter: none; opacity: .88; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.month-nav { display: flex; align-items: center; gap: 4px; }
.month-nav .lbl { min-width: 150px; text-align: center; font-weight: 600; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; }

/* Fases */
.fases { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.fases span { display: inline-flex; align-items: center; gap: 6px; }
.fases i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Calendário */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--line); gap: 1px; }
.cal .dow { background: var(--surface-2); padding: 8px 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.day { background: var(--surface); min-height: 128px; padding: 8px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.day.out { background: var(--bg); }
.day.out .dnum { opacity: .45; }
.day.today .dnum b { background: var(--ink); color: var(--bg); }
.dhead { display: flex; align-items: center; justify-content: space-between; }
.dnum { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.dnum b { display: inline-grid; place-items: center; min-width: 24px; height: 24px; border-radius: 999px; font-weight: 600; color: var(--ink); }
.dnum .wd { display: none; }
.add-day { opacity: 0; border: 0; background: transparent; color: var(--muted); font-size: 18px; width: 24px; height: 24px; border-radius: 6px; line-height: 1; }
.day:hover .add-day, .add-day:focus-visible { opacity: 1; }
.add-day:hover { background: var(--surface-2); color: var(--ink); }
.chip .prev { display: block; aspect-ratio: 4 / 3; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin-bottom: 3px; }
.chip .prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 760px) {
  .chip:has(.prev) { grid-template-columns: 64px minmax(0, 1fr); column-gap: 10px; align-items: center; }
  .chip .prev { grid-row: 1 / 3; aspect-ratio: 1; margin: 0; }
}
.chip { --fase: var(--line); text-align: left; border: 0; border-left: 4px solid var(--fase); background: color-mix(in srgb, var(--fase) 16%, var(--surface)); border-radius: 6px; padding: 5px 7px; font-size: 12.5px; line-height: 1.3; display: grid; gap: 2px; width: 100%; }
.chip:hover { background: color-mix(in srgb, var(--fase) 28%, var(--surface)); }
.chip .meta { display: flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chip .t { overflow-wrap: anywhere; }
.chip .t b { font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex: none; }
.fmt { display: inline-flex; align-items: center; gap: 4px; }
@media (max-width: 760px) {
  .cal { grid-template-columns: 1fr; }
  .cal .dow { display: none; }
  .day { min-height: 0; flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
  .day .dhead { width: 100%; }
  .day.out:not(.has) { display: none; }
  .day:not(.has) { padding-block: 6px; }
  .dnum .wd { display: inline; margin-left: 6px; }
  .add-day { opacity: 1; }
}

/* Tabela */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters select, .filters input, .field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.filters input { flex: 1 1 200px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 980px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in srgb, var(--manteiga) 22%, var(--surface)); }
tbody tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.st-sel { border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; background: var(--surface); font-size: 12.5px; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--ink); }
.pill .dot { background: var(--c); }
a.lnk { color: var(--caramelo); font-weight: 600; text-decoration: none; }
a.lnk:hover { text-decoration: underline; }
.muted { color: var(--muted); }

/* Fluxo */
.board { display: grid; grid-template-columns: repeat(7, minmax(210px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.col.over { outline: 2px dashed var(--caramelo); outline-offset: -2px; }
.col h3 { margin: 2px 4px 4px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.col h3 .n { margin-left: auto; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; gap: 4px; cursor: grab; }
.card:hover { border-color: var(--caramelo); }
.card .meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.card .t { font-weight: 600; font-size: 13px; }
.card .mv { display: flex; gap: 4px; justify-content: flex-end; }
.card .mv button { border: 1px solid var(--line); background: transparent; border-radius: 6px; width: 26px; height: 22px; font-size: 12px; color: var(--muted); }

/* Grade */
.grade-box { max-width: 520px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 0 0; overflow: hidden; }
.profile { display: flex; align-items: center; gap: 14px; padding: 0 16px 14px; }
.avatar { width: 58px; height: 58px; border-radius: 999px; background: var(--vinho); color: var(--vinho-ink); display: grid; place-items: center; font-family: var(--f-display); font-size: 26px; flex: none; }
.profile b { font-size: 15px; }
.grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; }
.tile { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border: 0; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; overflow: hidden; background: color-mix(in srgb, var(--fase, var(--caramelo)) 22%, var(--surface-2)); }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .tt { position: relative; font-family: var(--f-display); font-size: clamp(14px, 3.4vw, 19px); line-height: 1.08; overflow-wrap: anywhere; }
.tile .tm { position: relative; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile.has-img .tt, .tile.has-img .tm { display: none; }
.tile .fic { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.45); color: #fff; font-size: 10px; border-radius: 4px; padding: 1px 5px; font-weight: 600; }
.tile:hover { filter: brightness(.96); }
.grade-note { max-width: 520px; margin: 12px auto 0; font-size: 12.5px; color: var(--muted); text-align: center; }

/* Resumo */
.sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.panel h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.big { font-family: var(--f-display); font-size: 64px; line-height: .9; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 9em) 1fr 2.2em; gap: 10px; align-items: center; font-size: 13px; }
.bar .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .tr { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar .fl { height: 100%; border-radius: 99px; background: var(--c, var(--caramelo)); }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.obs { white-space: pre-wrap; margin: 0; }

/* Marca */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.form-grid > * { min-width: 0; }
.prod-row .icon-btn { flex: none; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.field textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
.fase-row { display: flex; gap: 8px; align-items: center; }
.fase-row input[type=text] { flex: 1; min-width: 0; }
.fase-row input[type=color] { width: 40px; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); }

/* Editor */
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); width: min(780px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgba(15, 15, 17, .55); }
dialog form { display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
.dlg-head { padding: 18px 20px 12px; display: flex; align-items: start; gap: 12px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.05; margin: 0; text-wrap: balance; }
.dlg-head .x { margin-left: auto; }
.dlg-body { padding: 16px 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.dlg-body .full { grid-column: 1 / -1; }
.dlg-body h4 { grid-column: 1 / -1; margin: 8px 0 -4px; font-size: 12px; color: var(--caramelo); letter-spacing: .12em; text-transform: uppercase; }
@media (max-width: 560px) { .dlg-body { grid-template-columns: 1fr; } }
.dlg-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dlg-foot .sp { flex: 1; }
.thumb { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.thumb img { width: 72px; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.confirm { display: flex; gap: 8px; align-items: center; color: var(--danger); font-weight: 500; }

/* Área da marca */
.subnav { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 18px; }
.subnav a { text-decoration: none; color: var(--muted); border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-weight: 500; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.subnav a:hover { color: var(--ink); border-color: var(--caramelo); }
.subnav a[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.subnav .pct { font-size: 11px; opacity: .75; font-variant-numeric: tabular-nums; }
.sec-intro { color: var(--muted); margin: -8px 0 16px; max-width: 70ch; }
.pf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.pf-grid .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .pf-grid { grid-template-columns: 1fr; } }
.field small { color: var(--muted); font-size: 12px; }
.field textarea.pf { min-height: 76px; }
.field input.filled, .field textarea.filled { border-color: color-mix(in srgb, var(--st-postado) 45%, var(--line)); }
.save-bar { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 16px; padding: 10px 12px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.save-bar .msg { margin-right: auto; color: var(--muted); font-size: 13px; }
.persona { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); display: grid; gap: 12px; }
.persona-head { display: flex; align-items: center; gap: 10px; }
.persona-head .av { width: 36px; height: 36px; border-radius: 99px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; flex: none; }
.persona-head b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.personas { display: grid; gap: 14px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.ov-card { display: grid; gap: 10px; align-content: start; text-decoration: none; color: inherit; }
.ov-card:hover { border-color: var(--caramelo); }
.ov-card h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.prog { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--st-postado); border-radius: 99px; }
.ov-card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 3px; }
.ov-head { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); margin-bottom: 18px; }
.ov-head b { color: var(--ink); font-weight: 600; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { display: grid; gap: 4px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sw i { width: 54px; height: 40px; border-radius: 8px; border: 1px solid var(--line); display: block; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.file { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.file .prev { aspect-ratio: 16 / 10; background: var(--surface-2); display: grid; place-items: center; position: relative; overflow: hidden; color: var(--muted); font-weight: 700; letter-spacing: .08em; font-size: 13px; }
.file .prev img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--surface-2); }
.file .info { padding: 10px; display: grid; gap: 4px; flex: 1; }
.file .info b { overflow-wrap: anywhere; font-weight: 600; }
.file .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px; }
.file-group h3 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; font-weight: 600; }
.upl { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: end; }
/* Login, equipe e aprovações */
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.me .who { white-space: nowrap; font-size: 15px; }
.me .who b { font-weight: 600; }
.me .papel { opacity: .7; font-size: 12px; white-space: nowrap; }
.me a { color: var(--vinho-ink); }
nav.tabs .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; border-radius: 99px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; }
.login { max-width: 380px; margin: 8vh auto 0; display: grid; gap: 14px; }

.flag { color: var(--danger); font-weight: 700; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.fluxo { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; background: var(--surface-2); }
.fluxo .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fluxo .steps { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; color: var(--muted); }
.fluxo .steps span { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); }
.fluxo .steps span.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fluxo .steps span.done { color: var(--ink); }
.btn.ok { background: var(--st-postado); border-color: var(--st-postado); color: var(--primary-ink); font-weight: 600; }
.hist { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; margin: 6px 0 0; padding-left: 16px; }
.hist b { color: var(--ink); font-weight: 600; }
.apv-sec h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
.apv-sec h2 .n { font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.apv-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .apv-list { grid-template-columns: 1fr; } }
.apv { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.apv .img { aspect-ratio: 4 / 3; background: var(--surface-2); position: relative; }
.apv .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.apv .bd { padding: 12px 14px; display: grid; gap: 8px; flex: 1; align-content: start; }
.apv .meta { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.apv .t { font-family: var(--f-display); font-size: 22px; line-height: 1.1; }
.apv .leg { white-space: pre-wrap; font-size: 13px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; max-height: 180px; overflow: auto; }
.apv .kv { font-size: 13px; }
.apv .kv b { font-weight: 600; }
.apv .acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 14px; align-items: center; }
.rej { display: grid; gap: 8px; width: 100%; }
.rej textarea { border: 1px solid var(--danger); border-radius: 10px; padding: 8px 10px; background: var(--surface); min-height: 70px; resize: vertical; }
.chk-list { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.chk-list label { display: inline-flex; gap: 6px; align-items: center; }
.prod-pick { display: flex; gap: 6px; }
.prod-pick select { flex: 1; min-width: 0; }
.prod-pick .icon-btn { width: 40px; height: auto; font-size: 20px; flex: none; }
.prod-new { display: flex; gap: 6px; margin-top: 6px; }
.prod-new input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.prod-list { display: grid; gap: 8px; }
.prod-row { display: flex; gap: 8px; align-items: center; }
.prod-row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.prod-row .n { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#agDlg { width: min(560px, calc(100vw - 24px)); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.seg input:checked + span { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.seg input:focus-visible + span { outline: 2px solid var(--caramelo); outline-offset: 2px; }
.passos { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: passo; }
.passos li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
.passos li::before { counter-increment: passo; content: counter(passo); width: 26px; height: 26px; border-radius: 99px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.passos .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
/* Relatório (dashboard do mês): uma folha clara de propósito, igual na tela, no PDF e na imagem */
.rel { --r-bg: #FFFFFF; --r-ink: #1D1D1F; --r-muted: #6B6B70; --r-line: #E4E4E0; --r-soft: #F2F2EF; --r-bar: #3E5C76; --r-bar2: #C9D3DD; --r-bad: #B3362F;
  background: var(--r-bg); color: var(--r-ink); border-radius: 16px; padding: 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; border: 1px solid var(--line); color-scheme: light; }
.rel h3 { margin: 0 0 12px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--r-muted); font-weight: 600; }
.rel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 20px; border-bottom: 1px solid var(--r-line); padding-bottom: 16px; }
.rel-head h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 4vw, 40px); line-height: 1; margin: 4px 0 0; color: var(--r-ink); }
.rel-head .eb { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--r-muted); font-weight: 600; }
.rel-head .gen { font-size: 12px; color: var(--r-muted); text-align: right; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpis > * { min-width: 0; }
.kpi { background: var(--r-soft); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.kpi .k { font-size: 12px; color: var(--r-muted); font-weight: 600; }
.kpi .n { font-family: var(--f-display); font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .n small { font-family: var(--f-body); font-size: 15px; color: var(--r-muted); margin-left: 4px; }
.kpi .d { font-size: 12.5px; color: var(--r-muted); }
.meter { height: 6px; border-radius: 99px; background: var(--r-bar2); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--r-bar); border-radius: 99px; }
.rel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 28px; }
.rel-grid .full { grid-column: 1 / -1; }
.rel-grid > section { min-width: 0; }
@media (max-width: 720px) { .rel { padding: 18px; } .rel-grid { grid-template-columns: minmax(0, 1fr); } .rbar { grid-template-columns: minmax(0, 7em) 1fr 4.6em; } }
.rbars { display: grid; gap: 7px; }
.rbar { display: grid; grid-template-columns: minmax(0, 10em) 1fr 5em; gap: 10px; align-items: center; font-size: 13px; }
.rbar .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rbar .tr { height: 12px; display: flex; gap: 2px; }
.rbar .fl { height: 100%; background: var(--r-bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.rbar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.rbar .v small { color: var(--r-muted); font-weight: 400; }
.wk { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; align-items: end; height: 170px; padding-top: 18px; border-bottom: 1px solid var(--r-line); }
.wk .c { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 0; position: relative; }
.wk .c .val { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.wk .c .s { width: min(46px, 70%); }
.wk .c .s.a { background: var(--r-bar2); border-radius: 4px 4px 0 0; }
.wk .c .s.b { background: var(--r-bar); margin-top: 2px; }
.wk-lb { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; font-size: 11.5px; color: var(--r-muted); text-align: center; margin-top: 6px; }
.lgd { display: flex; gap: 14px; font-size: 12px; color: var(--r-muted); margin-bottom: 4px; }
.lgd i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.rtab { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 0; }
.rtab th, .rtab td { padding: 7px 8px; border-bottom: 1px solid var(--r-line); text-align: left; background: transparent; color: var(--r-ink); position: static; }
.rtab th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--r-muted); font-weight: 600; }
.rtab td.n, .rtab th.n { text-align: right; font-variant-numeric: tabular-nums; }
.rtab tbody tr { cursor: default; }
.rtab tbody tr:hover td { background: transparent; }
.mot { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 13px; }
.mot li { border-left: 3px solid var(--r-bad); padding: 2px 0 2px 10px; }
.mot li span { color: var(--r-muted); }
.rel .vazio { color: var(--r-muted); font-size: 13px; margin: 0; }
.dl-bar { display: flex; flex-wrap: wrap; gap: 8px; }
.escopo { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.escopo button { border: 0; background: var(--surface); padding: 7px 12px; font-size: 13px; }
.escopo button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
/* caixa de seleção que abre uma lista e aceita vários itens */
.msel { position: relative; min-width: 0; }
.msel-btn { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; min-height: 38px; }
.msel-btn .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msel-btn .txt.vazio { color: var(--muted); }
.msel-btn .cnt { font-size: 11.5px; font-weight: 700; background: var(--surface-2); border-radius: 99px; padding: 1px 7px; }
.msel-btn::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-2px); flex: none; opacity: .7; }
.msel-btn:disabled { opacity: .7; cursor: default; }
.msel-pop { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; max-height: 280px; overflow-y: auto; }
.msel-op { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
.msel-op:hover { background: var(--surface-2); }
.msel-op input { position: absolute; opacity: 0; pointer-events: none; }
.msel-op .ck { width: 16px; flex: none; font-weight: 700; text-align: center; }
.msel-op input:checked + .ck::before { content: "✓"; }
.msel-op input:checked ~ .nm { font-weight: 600; }
.msel-op:has(input:focus-visible) { outline: 2px solid var(--caramelo); outline-offset: -2px; }
.msel-add { display: flex; gap: 6px; padding: 6px 4px 3px; border-top: 1px solid var(--line); margin-top: 4px; }
.msel-add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; }
.msel-vazio { padding: 8px 9px; font-size: 13px; color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty strong { font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 500; z-index: 50; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) { .chip, .card, .tile, .btn { transition: background .15s, border-color .15s, filter .15s; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Planejamento <em>de conteúdo</em></div>
    <div class="marca-pick">
      <label for="marcaSel" class="muted" style="color:inherit;opacity:.75;font-size:13px">Marca</label>
      <select id="marcaSel"></select>
      <button class="ghost-light" id="novaMarca" type="button">+ Nova marca</button>
    </div>
    <div class="me" id="me" hidden></div>
    <nav class="tabs" id="tabs">
      <a href="#calendario">Calendário</a>
      <a href="#pautas">Postagens</a>
      <a href="#fluxo">Fluxo de produção</a>
      <a href="#grade">Grade do Insta</a>
      <a href="#resumo">Resumo do mês</a>
      <a href="#marca">Marca</a>
      <a href="#aprovacoes">Aprovações<span class="badge" id="apvBadge" hidden></span></a>
      <a href="#equipe" id="tabEquipe" hidden>Equipe</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app">
  <div class="empty"><strong>Carregando o planejamento…</strong><span>As marcas e postagens aparecem aqui assim que a planilha responder.</span></div>
</main>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<dialog id="agDlg"><form id="agForm" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
const STATUS = ["Ideia", "Em validação", "Ideia reprovada", "Em produção", "Em aprovação", "Ajustes solicitados", "Aprovado", "Agendado", "Postado"];
const ST_VAR = { "Ideia": "--st-ideia", "Em validação": "--st-validado", "Ideia reprovada": "--danger", "Em produção": "--st-produzido", "Em aprovação": "--st-aprovado", "Ajustes solicitados": "--danger", "Aprovado": "--st-postado", "Agendado": "--st-agendado", "Postado": "--ink" };
const STATUS_ANTIGOS = { Validado: "Em produção", Produzido: "Em aprovação" };
const REPROVADOS = ["Ideia reprovada", "Ajustes solicitados"];
// colunas do quadro: status reprovado fica junto da etapa em que precisa ser refeito
const COLUNAS = [["Ideia", ["Ideia", "Ideia reprovada"]], ["Em validação", ["Em validação"]], ["Em produção", ["Em produção", "Ajustes solicitados"]], ["Em aprovação", ["Em aprovação"]], ["Aprovado", ["Aprovado"]], ["Agendado", ["Agendado"]], ["Postado", ["Postado"]]];
// mesmas regras do Codigo.gs; quem: editar = admin ou social da marca, aprovar = admin ou aprovador da marca
const ACOES = {
  enviarValidacao: { de: ["Ideia", "Ideia reprovada"], quem: "editar", label: "Enviar ideia para validação", ok: "Ideia enviada para validação" },
  validar: { de: ["Em validação"], quem: "aprovar", label: "Validar ideia", ok: "Ideia validada", tipo: "ok" },
  reprovarIdeia: { de: ["Em validação"], quem: "aprovar", label: "Reprovar ideia", ok: "Ideia reprovada", motivo: true },
  enviarAprovacao: { de: ["Em produção", "Ajustes solicitados"], quem: "editar", label: "Enviar conteúdo para aprovação", ok: "Conteúdo enviado para aprovação" },
  aprovar: { de: ["Em aprovação"], quem: "aprovar", label: "Aprovar conteúdo", ok: "Conteúdo aprovado. Pode agendar.", tipo: "ok" },
  pedirAjustes: { de: ["Em aprovação"], quem: "aprovar", label: "Não aprovar (pedir ajustes)", ok: "Ajustes pedidos", motivo: true },
  agendar: { de: ["Aprovado"], quem: "editar", label: "Agendar", ok: "Agendamento registrado", tipo: "ok", painel: true },
  reagendar: { de: ["Agendado"], quem: "editar", label: "Alterar agendamento", ok: "Agendamento alterado", painel: true },
  postar: { de: ["Aprovado", "Agendado"], quem: "editar", label: "Marcar como postado", ok: "Marcado como postado", painel: true }
};
const PAPEIS = { admin: "Administrador", diretor: "Diretor", gestor: "Gestor", social: "Social media", aprovador: "Aprovador" };
const TODAS = ["admin", "diretor", "gestor"]; // papéis que veem todas as marcas
const normStatus = s => STATUS_ANTIGOS[s] || (STATUS.includes(s) ? s : "Ideia");
const FORMATOS = ["Estático", "Carrossel", "Vídeo"];
const FMT_ICON = { "Estático": "▢", "Carrossel": "▤", "Vídeo": "▶" };
const OBJETIVOS = ["Descoberta", "Desejo", "Consideração", "Educação", "Autoridade", "Quebra de objeção", "Prova social", "Conversão"];
const REDES = ["Feed", "Reels", "Stories", "TikTok", "YouTube Shorts", "Facebook", "Pinterest", "LinkedIn", "Threads"];
// a rede é guardada como texto ("Feed + Stories"); aqui vira lista e volta
const redesDe = t => String(t || "").split(/\s*\+\s*|\s*,\s*/).map(x => x.trim()).filter(Boolean);
const NAO_FEED = ["Stories", "TikTok", "YouTube Shorts", "Facebook", "Pinterest", "LinkedIn", "Threads"];
// cada marca tem a sua lista de redes (Marca → Redes); sem lista própria, vale a padrão
function opcoesRede(m = marca()) {
  const l = m && m.perfil && Array.isArray(m.perfil.redes) ? m.perfil.redes : null;
  return l ? [...l] : [...REDES];
}
const WD = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const DEFAULT_FASES = [
  { nome: "Lançamento", cor: "#A9A9A4" },
  { nome: "Aquecimento da promoção", cor: "#8E9690" },
  { nome: "Contagem regressiva", cor: "#8C8A96" },
  { nome: "Semana da promoção", cor: "#6B6B70" },
  { nome: "Última chamada", cor: "#3F3F43" }
];

const S = {
  canWrite: false, eu: null, usuarios: [], token: store("token") || "", rej: null, uEdit: null,
  marcas: [], posts: [], loadedM: false, loadedP: false, failed: false,
  marcaId: store("marca"), month: null,
  f: { status: "", formato: "", produto: "", q: "" },
  confirmDel: false
};

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem("plan." + k);
    localStorage.setItem("plan." + k, v);
  } catch (e) { return null; }
}
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = (s || "").split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const br = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : "";
const brFull = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "";
const wd = s => s ? WD[parse(s).getDay()] : "";
const monthLabel = ym => { const t = parse(ym + "-01").toLocaleDateString("pt-BR", { month: "long", year: "numeric" }); return t.charAt(0).toUpperCase() + t.slice(1); };
const shiftMonth = (ym, n) => { const d = parse(ym + "-01"); d.setMonth(d.getMonth() + n); return iso(d).slice(0, 7); };
const stColor = st => `var(${ST_VAR[st] || "--st-ideia"})`;
// vários produtos ficam guardados como "Produto A + Produto B"
const prodsDe = t => String(t || "").split(/\s+\+\s+/).map(x => x.trim()).filter(Boolean);
const prodCurto = p => { const l = prodsDe(p.produto); return l.length > 1 ? `${l[0]} +${l.length - 1}` : (l[0] || ""); };
const nm = p => prodCurto(p) ? `${prodCurto(p)}: ${p.postagem || "sem título"}` : (p.postagem || "sem título");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200);
}

const ehAdmin = () => S.eu?.papel === "admin";
const ehGestor = () => S.eu?.papel === "gestor";
const ehDiretor = () => S.eu?.papel === "diretor";
// diretor: tudo do gestor + equipe (exceto administradores e diretores), criar marcas, configurações e forçar status
const podeGerir = () => ehAdmin() || ehDiretor();
// gestor: vê tudo, alimenta e aprova, mas não mexe na estrutura (equipe, marcas, configurações)
const temAcesso = mid => TODAS.includes(S.eu?.papel) || (S.eu?.marcas || []).includes("*") || (S.eu?.marcas || []).includes(mid);
const podeEditar = mid => TODAS.includes(S.eu?.papel) || (S.eu?.papel === "social" && temAcesso(mid));
const podeAprovar = mid => TODAS.includes(S.eu?.papel) || (S.eu?.papel === "aprovador" && temAcesso(mid));
const podeAcao = (p, k) => { const a = ACOES[k]; return a.de.includes(p.status) && (a.quem === "aprovar" ? podeAprovar(p.marcaId) : podeEditar(p.marcaId)); };
const nomeMarca = id => (S.marcas.find(m => m.id === id) || {}).nome || "";
const marca = () => S.marcas.find(m => m.id === S.marcaId) || null;
const fasesDe = m => (m && Array.isArray(m.fases) && m.fases.length) ? m.fases : DEFAULT_FASES;
const faseCor = (m, nome) => (fasesDe(m).find(f => f.nome === nome) || {}).cor || "var(--line)";
const postsMarca = () => S.posts.filter(p => p.marcaId === S.marcaId).sort((a, b) => (a.data || "").localeCompare(b.data || "") || (a.ordem || 0) - (b.ordem || 0));
const postsMes = () => postsMarca().filter(p => (p.data || "").startsWith(S.month));
const produtosDe = m => {
  const set = new Set((m && m.produtos) || []);
  postsMarca().forEach(p => prodsDe(p.produto).forEach(x => set.add(x)));
  return [...set];
};

function pickMonth() {
  const saved = store("mes." + S.marcaId);
  if (saved) return saved;
  const today = iso(new Date()).slice(0, 7);
  const ps = postsMarca();
  if (!ps.length || ps.some(p => p.data.startsWith(today))) return today;
  const next = ps.find(p => p.data.slice(0, 7) >= today);
  return (next || ps[ps.length - 1]).data.slice(0, 7);
}
function setMonth(ym) { S.month = ym; store("mes." + S.marcaId, ym); render(); }

/* ---------- Vistas ---------- */

async function copiarCodigo() {
  const b = $("#btCod"); b.disabled = true; b.textContent = "Copiando…";
  try {
    // o Codigo.gs vai junto com o site no GitHub Pages, então é sempre a versão certa
    const r = await fetch("apps-script/Codigo.gs?v=" + VERSAO_SCRIPT, { cache: "no-store" });
    if (!r.ok) throw new Error("http " + r.status);
    const txt = await r.text();
    if (!txt.includes(VERSAO_SCRIPT)) throw new Error("versão diferente");
    await navigator.clipboard.writeText(txt);
    b.textContent = "Código copiado ✓"; toast("Código copiado. Agora cole no Apps Script.");
  } catch (e) {
    b.disabled = false; b.textContent = "Copiar código novo";
    toast("Não consegui copiar. Abra o Codigo.gs no GitHub e copie por lá.");
  }
}

function vCal() {
  const m = marca();
  const first = parse(S.month + "-01");
  const start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const end = new Date(last); end.setDate(last.getDate() + (6 - last.getDay()));
  const byDay = {};
  postsMarca().forEach(p => (byDay[p.data] ||= []).push(p));
  const today = iso(new Date());
  let cells = WD.map(d => `<div class="dow">${d}</div>`).join("");
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = iso(d), ps = byDay[k] || [];
    const out = d.getMonth() !== first.getMonth();
    ps.sort((a, b) => FORMATOS.indexOf(a.formato) - FORMATOS.indexOf(b.formato));
    cells += `<div class="day${out ? " out" : ""}${ps.length ? " has" : ""}${k === today ? " today" : ""}">
      <div class="dhead"><span class="dnum"><b>${d.getDate()}</b><span class="wd">${WD[d.getDay()]}</span></span>
      ${S.canWrite ? `<button class="add-day" type="button" aria-label="Nova postagem em ${br(k)}" onclick="openEditor(null,'${k}')">+</button>` : ""}</div>
      ${ps.map(p => `<button class="chip" type="button" style="--fase:${esc(faseCor(m, p.fase))}" onclick="openEditor('${esc(p.id)}')">
        ${blobSrc(p) ? `<span class="prev"><img src="${esc(blobSrc(p))}" alt="" loading="lazy" onerror="this.parentNode.remove()"></span>` : ""}
        <span class="meta"><span class="fmt">${FMT_ICON[p.formato] || ""} ${esc(p.formato || "")}</span><span class="dot" style="background:${stColor(p.status)}" title="${esc(p.status)}"></span>${REPROVADOS.includes(p.status) ? `<span class="flag">${p.status === "Ideia reprovada" ? "Reprovada" : "Ajustes"}</span>` : ""}${p.status === "Agendado" && p.agHora ? `<span title="Agendado">⏰ ${esc(p.agHora)}${p.agData && p.agData !== p.data ? " " + br(p.agData) : ""}</span>` : ""}</span>
        <span class="t" title="${esc(prodsDe(p.produto).join(", "))}"><b>${esc(prodCurto(p))}${prodCurto(p) ? ":" : ""}</b> ${esc(p.postagem || "sem título")}</span></button>`).join("")}
    </div>`;
  }
  const n = postsMes().length;
  return headM(m.nome, "Calendário", monthNav() + addBtn()) +
    `<div class="cal">${cells}</div>
    <p class="muted" style="margin-top:12px">${n} ${n === 1 ? "publicação" : "publicações"} em ${esc(monthLabel(S.month))}. A bolinha indica o status. Clique num post para abrir o detalhamento.</p>`;
}

async function setStatus(id, st) {
  const p = S.posts.find(x => x.id === id);
  const antes = p && p.status;
  if (p) { p.status = st; render(); }
  try { await api("acao", { id, acao: "definir", status: st }); await carregar(); toast(`Status: ${st}`); }
  catch (e) { if (p) { p.status = antes; render(); } writeFail(e); }
}

async function copiarTabela() {
  const cols = ["status", "data", "dia", "postagem", "fase", "formato", "produto", "pauta", "objetivo", "cta", "rede", "gravacao", "observacao", "inspiracao", "legenda", "criativo"];
  const header = ["Status", "Marca", "Data", "Dia", "Postagem", "Fase", "Formato", "Produto", "Nome", "Objetivo (jornada de compra)", "CTA / destino", "Rede", "Gravação", "Observação", "Inspiração", "Legenda", "Criativo"];
  const clean = v => String(v ?? "").replace(/[\t\r\n]+/g, " ");
  const lines = [header.join("\t")].concat(filtered().map(p => {
    const row = cols.map(c => c === "data" ? brFull(p.data) : c === "dia" ? wd(p.data) : clean(p[c]));
    row.splice(1, 0, marca().nome);
    return row.join("\t");
  }));
  const txt = lines.join("\n");
  try { await navigator.clipboard.writeText(txt); toast("Tabela copiada. Cole no Google Sheets."); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Tabela copiada."); } catch (_) { toast("Não deu para copiar."); }
    ta.remove();
  }
}

function wireBoard() {
  if (!podeGerir()) return;
  document.querySelectorAll(".card").forEach(c => c.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", c.dataset.id)));
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => {
      e.preventDefault(); col.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain");
      const p = S.posts.find(x => x.id === id);
      if (p && p.status !== col.dataset.st) setStatus(id, col.dataset.st);
    });
  });
}

const driveId = u => { const m = String(u || "").match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]{20,})/); return m ? m[1] : ""; };
// prévia: primeiro o link da imagem; se não tiver, o próprio criativo quando ele é um arquivo do Drive

/* ---------- Resumo do mês: dashboard para apresentar ---------- */
function dadosResumo() {
  const todas = S.resumoTodas && S.marcas.length > 1;
  const ps = S.posts.filter(p => (todas || p.marcaId === S.marcaId) && (p.data || "").startsWith(S.month))
    .sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  return { todas, ps, titulo: todas ? "Todas as marcas" : (marca() || {}).nome || "" };
}
function rbars(map, total, naOrdem) {
  const ent = naOrdem ? Object.entries(map) : Object.entries(map).sort((a, b) => b[1] - a[1]);
  if (!ent.length) return `<p class="vazio">Sem dados neste mês.</p>`;
  const max = Math.max(1, ...ent.map(e => e[1]));
  return `<div class="rbars">${ent.map(([k, v]) => `<div class="rbar" title="${esc(k)}: ${v} (${Math.round(v / total * 100)}%)">
    <span class="lb">${esc(k)}</span><span class="tr"><span class="fl" style="width:${(v / max * 100).toFixed(1)}%"></span></span><span class="v">${v} <small>${Math.round(v / total * 100)}%</small></span></div>`).join("")}</div>`;
}
const ETAPAS_REL = [["Ideia", ["Ideia", "Ideia reprovada"]], ["Em validação", ["Em validação"]], ["Em produção", ["Em produção", "Ajustes solicitados"]], ["Em aprovação", ["Em aprovação"]], ["Aprovado", ["Aprovado"]], ["Agendado", ["Agendado"]], ["Postado", ["Postado"]]];
function calcResumo(ps) {
  const n = ps.length, conta = f => ps.filter(f).length;
  const postadas = conta(p => p.status === "Postado");
  const prontas = conta(p => ["Aprovado", "Agendado", "Postado"].includes(p.status));
  // aprovado de primeira: chegou a Aprovado sem nenhum "Pediu ajustes" no histórico
  const aprovadas = ps.filter(p => (p.historico || []).some(h => (h.acao || "").startsWith("Aprovou")));
  const deprimeira = aprovadas.filter(p => !(p.historico || []).some(h => (h.acao || "").startsWith("Pediu ajustes"))).length;
  const ideiasVal = ps.filter(p => (p.historico || []).some(h => (h.acao || "").startsWith("Validou")));
  const ideiasDePrimeira = ideiasVal.filter(p => !(p.historico || []).some(h => (h.acao || "").startsWith("Reprovou"))).length;
  const tempos = aprovadas.map(p => {
    const c = (p.historico || []).find(h => (h.acao || "").startsWith("Criou"));
    const a = (p.historico || []).find(h => (h.acao || "").startsWith("Aprovou"));
    return c && a ? (a.em - c.em) / 864e5 : null;
  }).filter(x => x != null && x >= 0);
  const devol = [];
  ps.forEach(p => (p.historico || []).forEach(h => { if (h.motivo) devol.push({ ...h, post: p }); }));
  devol.sort((a, b) => b.em - a.em);
  const etapas = {}; ETAPAS_REL.forEach(([t, sts]) => etapas[t] = conta(p => sts.includes(p.status)));
  const by = key => ps.reduce((o, p) => { const k = p[key] || "Não definido"; o[k] = (o[k] || 0) + 1; return o; }, {});
  const tipos = ps.filter(p => p.agTipo).reduce((o, p) => (o[p.agTipo] = (o[p.agTipo] || 0) + 1, o), {});
  // semanas do mês (domingo a sábado)
  const first = parse(S.month + "-01"), semanas = [];
  for (let d = new Date(first); d.getMonth() === first.getMonth(); d.setDate(d.getDate() + 1)) {
    const w = Math.floor((d.getDate() + first.getDay() - 1) / 7);
    semanas[w] = semanas[w] || { ini: d.getDate(), fim: d.getDate(), plan: 0, post: 0 };
    semanas[w].fim = d.getDate();
  }
  ps.forEach(p => { const d = parse(p.data); const w = Math.floor((d.getDate() + first.getDay() - 1) / 7); if (semanas[w]) { semanas[w].plan++; if (p.status === "Postado") semanas[w].post++; } });
  // equipe: ações registradas nas postagens do mês
  const pessoas = {};
  ps.forEach(p => (p.historico || []).forEach(h => {
    if (!h.por || h.por === "Importação") return;
    const o = pessoas[h.por] = pessoas[h.por] || { criou: 0, enviou: 0, aprovou: 0, devolveu: 0 };
    const a = h.acao || "";
    if (a.startsWith("Criou")) o.criou++;
    else if (a.startsWith("Enviou")) o.enviou++;
    else if (a.startsWith("Validou") || a.startsWith("Aprovou")) o.aprovou++;
    else if (a.startsWith("Reprovou") || a.startsWith("Pediu")) o.devolveu++;
  }));
  const marcas = {};
  ps.forEach(p => { const o = marcas[p.marcaId] = marcas[p.marcaId] || { plan: 0, post: 0, prontas: 0, devol: 0 }; o.plan++; if (p.status === "Postado") o.post++; if (["Aprovado", "Agendado", "Postado"].includes(p.status)) o.prontas++; o.devol += (p.historico || []).filter(h => h.motivo).length; });
  return { n, postadas, prontas, aprovadas: aprovadas.length, deprimeira, ideiasVal: ideiasVal.length, ideiasDePrimeira, tempoMedio: tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : null, devol, etapas, by, tipos, semanas: semanas.filter(Boolean), pessoas, marcas };
}

const LIBS = {
  html2canvas: "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
  jspdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
};
function carregarLib(url) {
  return new Promise((ok, erro) => {
    if (document.querySelector(`script[src="${url}"]`)) return ok();
    const sc = document.createElement("script"); sc.src = url; sc.onload = ok; sc.onerror = erro; document.head.appendChild(sc);
  });
}
function nomeArquivo(ext) {
  const { titulo } = dadosResumo();
  const slug = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
  return `relatorio-${slug(titulo)}-${S.month}.${ext}`;
}
function baixarBlob(blob, nome) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function capturarRelatorio() {
  await carregarLib(LIBS.html2canvas);
  // copia a folha numa largura fixa fora da tela, para o arquivo sair igual no celular e no computador
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-10000px;top:0;width:1120px;";
  box.innerHTML = relatorioHtml();
  document.body.appendChild(box);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    return await html2canvas(box.firstElementChild, { scale: 2, backgroundColor: "#FFFFFF", logging: false });
  } finally { box.remove(); }
}
async function baixarRelatorio(tipo) {
  const btn = $(tipo === "pdf" ? "#dlPdf" : "#dlPng"), txt = btn.textContent;
  btn.disabled = true; btn.textContent = "Gerando…";
  try {
    const canvas = await capturarRelatorio();
    if (tipo === "png") {
      await new Promise(ok => canvas.toBlob(b => { baixarBlob(b, nomeArquivo("png")); ok(); }, "image/png"));
    } else {
      await carregarLib(LIBS.jspdf);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
      const W = 297, H = 210, mg = 8, larg = W - mg * 2;
      const pxPorMm = canvas.width / larg, altPag = Math.floor((H - mg * 2) * pxPorMm);
      // divide em páginas A4 deitadas quando o relatório é mais alto que uma folha
      for (let y = 0, pg = 0; y < canvas.height; y += altPag, pg++) {
        const h = Math.min(altPag, canvas.height - y);
        const parte = document.createElement("canvas"); parte.width = canvas.width; parte.height = h;
        parte.getContext("2d").drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
        if (pg) pdf.addPage();
        pdf.addImage(parte.toDataURL("image/jpeg", 0.92), "JPEG", mg, mg, larg, h / pxPorMm);
      }
      pdf.save(nomeArquivo("pdf"));
    }
    toast("Arquivo baixado");
  } catch (e) {
    toast("Não consegui gerar o arquivo. Confira a internet e tente de novo.");
  } finally { btn.disabled = false; btn.textContent = txt; }
}
function baixarCsv() {
  const { ps, todas } = dadosResumo();
  const cols = [["Marca", p => nomeMarca(p.marcaId)], ["Data", p => brFull(p.data)], ["Dia", p => wd(p.data)], ["Status", p => p.status], ["Título", p => p.postagem], ["Nome", p => p.pauta], ["Formato", p => p.formato], ["Produto", p => p.produto], ["Fase", p => p.fase], ["Objetivo", p => p.objetivo], ["Rede", p => p.rede], ["Agendado como", p => p.agTipo], ["Agendado para", p => p.agData ? brFull(p.agData) + " " + (p.agHora || "") : ""], ["Link da publicação", p => p.criativo], ["Imagem de prévia", p => p.capa], ["Link do post", p => p.postLink], ["Devoluções", p => (p.historico || []).filter(h => h.motivo).length], ["Último motivo", p => p.motivo]];
  const cel = v => { const t = String(v ?? ""); return /[";\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const linhas = [cols.map(c => c[0]).join(";")].concat(ps.map(p => cols.map(c => cel(c[1](p))).join(";")));
  baixarBlob(new Blob(["﻿" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" }), nomeArquivo("csv"));
  toast(todas ? "Planilha de todas as marcas baixada" : "Planilha baixada");
}

const ESSENCIAIS = ["Direcionamento de Instagram", "Manual da marca", "Logotipo"];

const perfilDe = m => (m && m.perfil && typeof m.perfil === "object") ? m.perfil : {};
const arquivosDe = m => (m && Array.isArray(m.arquivos)) ? m.arquivos : [];
const cheio = v => String(v ?? "").trim() !== "";

function progresso(m) {
  const p = perfilDe(m), arqs = arquivosDe(m);
  const conta = (campos, obj) => ({ ok: campos.filter(c => cheio(obj[c[0]])).length, total: campos.length, faltam: campos.filter(c => !cheio(obj[c[0]])).map(c => c[1]) });
  const sobre = conta(SECOES.sobre.campos, p);
  const pub = conta(SECOES.publico.campos, p);
  const pers = (p.personas || [])[0] || {};
  const pp = conta(SECOES.publico.persona, pers);
  const publico = { ok: pub.ok + pp.ok, total: pub.total + pp.total, faltam: (p.personas || []).length ? pub.faltam.concat(pp.faltam.map(x => "Persona: " + x.toLowerCase())) : ["Criar a primeira persona"].concat(pub.faltam) };
  const vis = conta(SECOES.visual.campos, p);
  const tem = ESSENCIAIS.filter(t => arqs.some(a => a.tipo === t));
  const arquivos = { ok: vis.ok + tem.length, total: vis.total + ESSENCIAIS.length, faltam: ESSENCIAIS.filter(t => !tem.includes(t)).map(t => "Arquivo: " + t).concat(vis.faltam) };
  const notas = conta(SECOES.notas.campos, p);
  return { sobre, publico, arquivos, notas };
}
const pct = x => x.total ? Math.round(x.ok / x.total * 100) : 0;

function subnav() {
  const pr = progresso(marca()), v = view();
  const it = [["marca", "Visão geral"], ["marca-sobre", "Sobre", pr.sobre], ["marca-produtos", "Produtos"], ["marca-redes", "Redes"], ["marca-publico", "Público-alvo", pr.publico], ["marca-arquivos", "Arquivos e identidade", pr.arquivos], ["marca-notas", "Observações", pr.notas], ["marca-config", "Configurações"]];
  return `<nav class="subnav" aria-label="Seções da marca">${it.map(([h, l, x]) => `<a href="#${h}"${v === h ? ' aria-current="page"' : ""}>${l}${x ? `<span class="pct">${pct(x)}%</span>` : ""}</a>`).join("")}</nav>`;
}

function vMarcaGeral() {
  const m = marca(), p = perfilDe(m), pr = progresso(m);
  const total = Object.values(pr).reduce((a, x) => ({ ok: a.ok + x.ok, total: a.total + x.total }), { ok: 0, total: 0 });
  const card = (h, titulo, x, desc) => `<a class="panel ov-card" href="#${h}">
      <h2>${pct(x)}% preenchido</h2><h3>${titulo}</h3><div class="prog"><i style="width:${pct(x)}%"></i></div>
      <span class="muted">${desc}</span>
      ${x.faltam.length ? `<div><b style="font-size:12px">Para completar</b><ul>${x.faltam.slice(0, 5).map(f => `<li>${esc(f)}</li>`).join("")}${x.faltam.length > 5 ? `<li>e mais ${x.faltam.length - 5}</li>` : ""}</ul></div>` : `<b style="color:var(--st-postado)">Completo</b>`}
    </a>`;
  const info = [["@", p.instagram], ["Segmento", p.segmento], ["Cidade", p.cidade], ["Vende em", p.canais]].filter(x => cheio(x[1]));
  return headM(m.nome, "Marca", `<span class="muted">${pct(total)}% do perfil preenchido</span>`) + subnav() +
    (info.length ? `<div class="ov-head">${info.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>` : "") +
    `<div class="ov-grid">
      ${card("marca-sobre", "Sobre a marca", pr.sobre, "História, diferenciais, carro-chefe e contatos.")}
      ${card("marca-publico", "Público-alvo", pr.publico, `${(p.personas || []).length} persona(s) cadastrada(s).`)}
      ${card("marca-arquivos", "Arquivos e identidade", pr.arquivos, `${arquivosDe(m).length} arquivo(s): direcionamento, manual, logotipo e vetores.`)}
      ${card("marca-notas", "Observações", pr.notas, "Tom de voz, pilares, datas, aprovação e aprendizados.")}
    </div>`;
}

function campoHtml([k, label, tipo, ph], val, extra = "") {
  const ro = S.canWrite ? "" : " disabled", cls = cheio(val) ? " filled" : "";
  const full = tipo === "area" ? " full" : "";
  const input = tipo === "area"
    ? `<textarea class="pf${cls}" data-k="${k}" rows="3" placeholder="${esc(ph)}"${ro}>${esc(val)}</textarea>`
    : `<input class="${cls}" data-k="${k}" value="${esc(val)}" placeholder="${esc(ph)}"${ro}>`;
  return `<label class="field${full}"><span>${esc(label)}</span>${input}${extra}</label>`;
}
function saveBar(label = "Salvar") {
  return S.canWrite ? `<div class="save-bar"><span class="msg">Tudo salvo</span><button class="btn primary" type="submit">${label}</button></div>` : "";
}

function vPerfil(sec) {
  const m = marca(), p = perfilDe(m), d = SECOES[sec];

    <form class="panel" onsubmit="event.preventDefault();salvarPerfil(this)">
      <div class="pf-grid">${d.campos.map(c => campoHtml(c, p[c[0]])).join("")}</div>

}

function personaHtml(pe = {}, i = 0) {

  return `<div class="persona" data-persona>
    <div class="persona-head"><span class="av">${esc(ini)}</span><b>${esc(pe.nome || "Nova persona")}</b>
      ${S.canWrite ? `<button class="btn sm danger" type="button" style="margin-left:auto" onclick="this.closest('[data-persona]').remove();S.dirty=true;$('#app .save-bar .msg').textContent='Alterações não salvas'">Remover</button>` : ""}</div>
    <div class="pf-grid">${SECOES.publico.persona.map(c => campoHtml(c, pe[c[0]])).join("")}</div>
  </div>`;
}
function vPublico() {
  const m = marca(), p = perfilDe(m), d = SECOES.publico, ps = p.personas || [];
  return headM(m.nome, d.titulo) + subnav() + `<p class="sec-intro">${esc(d.intro)}</p>
    <form onsubmit="event.preventDefault();salvarPerfil(this)">
      <div class="panel" data-geral><h2>Perfil geral</h2><div class="pf-grid">${d.campos.map(c => campoHtml(c, p[c[0]])).join("")}</div></div>
      <div style="display:flex;align-items:center;gap:10px;margin:22px 0 12px"><h2 style="font-family:var(--f-display);font-weight:400;font-size:28px;margin:0">Personas</h2>
        ${S.canWrite ? `<button class="btn sm" type="button" style="margin-left:auto" onclick="addPersona()">+ Persona</button>` : ""}</div>
      <div class="personas" id="personas">${ps.length ? ps.map(personaHtml).join("") : `<div class="empty" id="semPersona"><strong>Nenhuma persona ainda</strong><span>Uma persona é um cliente fictício que representa um grupo real. Ela ajuda a escolher temas, linguagem e CTAs.</span></div>`}</div>
      ${saveBar("Salvar público-alvo")}
    </form>`;
}
function addPersona() {
  $("#semPersona")?.remove();
  $("#personas").insertAdjacentHTML("beforeend", personaHtml({}));
  $("#personas [data-persona]:last-child input").focus();
  S.dirty = true;
}

async function salvarPerfil(form, extra = {}) {
  const novo = { ...perfilDe(marca()) };
  const geral = form.querySelector("[data-geral]") || form;
  geral.querySelectorAll("[data-k]").forEach(el => { if (!el.closest("[data-persona]")) novo[el.dataset.k] = el.value.trim(); });
  if (form.querySelector("#personas")) {
    novo.personas = [...form.querySelectorAll("[data-persona]")].map(card => {
      const o = {}; card.querySelectorAll("[data-k]").forEach(el => o[el.dataset.k] = el.value.trim()); return o;
    }).filter(o => Object.values(o).some(cheio));
  }
  Object.assign(novo, extra);
  const btn = form.querySelector("button[type=submit]");
  if (btn) { btn.disabled = true; btn.textContent = "Salvando…"; }
  try {
    await api("salvarMarca", { marca: { ...marca(), perfil: novo } });
    S.dirty = false; await carregar(); toast("Salvo");
  } catch (e) { if (btn) { btn.disabled = false; btn.textContent = "Salvar"; } writeFail(e); }
}

/* Arquivos */
const ext = a => ((a.nome || "").match(/\.([a-z0-9]{2,5})$/i) || [, ""])[1].toUpperCase();
function arquivoCard(a) {
  const did = a.driveId || driveId(a.url);
  const conf = S.delArq === a.id;
  return `<div class="file">
    <div class="prev">${ext(a) || esc((a.tipo || "").slice(0, 3).toUpperCase())}${did ? `<img src="https://drive.google.com/thumbnail?id=${esc(did)}&sz=w400" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
    <div class="info"><b>${esc(a.nome || "Sem nome")}</b><span class="muted" style="font-size:12px">${esc(a.tipo || "")}${a.data ? " · " + esc(brFull(a.data)) : ""}</span>${a.nota ? `<span style="font-size:12.5px">${esc(a.nota)}</span>` : ""}</div>
    <div class="acts">
      ${/^https?:\/\//.test(a.url || "") ? `<a class="btn sm" href="${esc(a.url)}" target="_blank" rel="noopener">Abrir</a><button class="btn sm" type="button" onclick="copiarTexto('${esc(a.url)}','Link copiado')">Copiar link</button>` : ""}
      ${S.canWrite ? (conf ? `<span class="confirm" style="font-size:12.5px">Remover? <button class="btn sm danger" type="button" onclick="removerArquivo('${esc(a.id)}')">Sim</button><button class="btn sm" type="button" onclick="S.delArq=null;render()">Não</button></span>`
        : `<button class="btn sm danger" type="button" onclick="S.delArq='${esc(a.id)}';render()">Remover</button>`) : ""}
    </div></div>`;
}
function vArquivos() {
  const m = marca(), p = perfilDe(m), arqs = arquivosDe(m), d = SECOES.visual;
  const cores = (String(p.cores || "").match(/#[0-9a-f]{6}\b|#[0-9a-f]{3}\b/gi) || []);
  const grupos = TIPOS_ARQ.map(t => [t, arqs.filter(a => (TIPOS_ARQ.includes(a.tipo) ? a.tipo : "Outros") === t)]).filter(g => g[1].length);
  const ro = S.canWrite ? "" : " disabled";
  return headM(m.nome, "Arquivos e identidade") + subnav() +
    `<p class="sec-intro">Direcionamento de Instagram, manual da marca, logotipos, vetores e tudo que a equipe precisa ter à mão. Os arquivos enviados vão para uma pasta no Google Drive, compartilhada com quem tiver o link.</p>
    ${S.canWrite ? `<form class="panel" id="uplForm" onsubmit="event.preventDefault();adicionarArquivo()" style="margin-bottom:16px">
      <h2>Adicionar arquivo</h2>
      <div class="upl">
        <label class="field"><span>Tipo</span><select id="aTipo">${TIPOS_ARQ.map(t => `<option>${t}</option>`).join("")}</select></label>
        <label class="field"><span>Nome</span><input id="aNome" placeholder="Ex.: Logo horizontal (vetor)"></label>
        <label class="field"><span>Enviar do computador</span><input id="aFile" type="file"></label>
        <label class="field"><span>ou colar um link</span><input id="aUrl" placeholder="Drive, Canva, Figma, Dropbox…"></label>
        <label class="field" style="grid-column:1/-1"><span>Observação (opcional)</span><input id="aNota" placeholder="Ex.: usar a versão branca sobre fundo escuro"></label>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" type="submit" id="aBtn">Adicionar</button></div>
    </form>` : ""}
    ${grupos.length ? grupos.map(([t, as]) => `<section class="file-group"><h3>${esc(t)} · ${as.length}</h3><div class="files">${as.map(arquivoCard).join("")}</div></section>`).join("")
      : `<div class="empty"><strong>Nenhum arquivo ainda</strong><span>Comece pelo direcionamento de Instagram, o manual da marca e o logotipo em vetor (.ai, .svg, .pdf ou .eps).</span></div>`}
    <form class="panel" style="margin-top:22px" onsubmit="event.preventDefault();salvarPerfil(this)">
      <h2>Identidade visual</h2>
      ${cores.length ? `<div class="swatches" style="margin-bottom:12px">${cores.map(c => `<span class="sw"><i style="background:${esc(c)}"></i>${esc(c.toUpperCase())}</span>`).join("")}</div>` : ""}
      <div class="pf-grid">${d.campos.map(c => campoHtml(c, p[c[0]])).join("")}</div>
      ${saveBar("Salvar identidade visual")}
    </form>`;
}
function lerBase64(file) {
  return new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = err; r.readAsDataURL(file); });
}
async function adicionarArquivo() {
  const file = $("#aFile").files[0], url = $("#aUrl").value.trim();
  if (!file && !url) return toast("Escolha um arquivo ou cole um link.");
  if (file && file.size > 25 * 1024 * 1024) return toast("Arquivo grande demais (máx. 25 MB). Envie pelo Drive e cole o link.");
  const btn = $("#aBtn"); btn.disabled = true;
  try {
    const item = { id: "a" + Date.now().toString(36), tipo: $("#aTipo").value, nome: $("#aNome").value.trim() || (file ? file.name : url), nota: $("#aNota").value.trim(), data: iso(new Date()), url };
    if (file) {
      btn.textContent = "Enviando…";
      const r = await api("enviarArquivo", { marcaId: S.marcaId, nome: file.name, mime: file.type || "application/octet-stream", base64: await lerBase64(file) });
      item.url = r.url; item.driveId = r.driveId;
      if (!$("#aNome").value.trim()) item.nome = file.name;
    }
    btn.textContent = "Salvando…";
    await api("salvarMarca", { marca: { ...marca(), arquivos: arquivosDe(marca()).concat(item) } });
    S.dirty = false; await carregar(); toast("Arquivo adicionado");
  } catch (e) { btn.disabled = false; btn.textContent = "Adicionar"; writeFail(e); }
}
async function removerArquivo(id) {
  try {
    await api("salvarMarca", { marca: { ...marca(), arquivos: arquivosDe(marca()).filter(a => a.id !== id) } });
    S.delArq = null; await carregar(); toast("Arquivo removido da lista");
  } catch (e) { writeFail(e); }
}
async function copiarTexto(t, ok) {
  try { await navigator.clipboard.writeText(t); toast(ok); } catch (e) { toast(t); }
}

/* Produtos */
function vProdutos() {
  const m = marca(), ro = S.canWrite ? "" : " disabled";
  const prods = m.produtos || [];
  const usados = produtosDe(m).filter(x => !prods.includes(x));
  const conta = x => postsMarca().filter(p => prodsDe(p.produto).includes(x)).length;
  return headM(m.nome, "Produtos") + subnav() +
    `<p class="sec-intro">Os produtos daqui aparecem para marcar em cada postagem e no Resumo do mês. Apagar um produto tira ele da lista; as postagens que já usam continuam com ele marcado até alguém desmarcar.</p>
    <form class="panel" style="max-width:640px" onsubmit="event.preventDefault();salvarLista('prod')">
      <div class="prod-list" id="prodList">${prods.map(x => prodRow(x, conta(x), ro)).join("") || `<p class="muted" id="semProd">Nenhum produto ainda. Clique em + Produto.</p>`}</div>
      ${S.canWrite ? `<button class="btn sm" type="button" style="margin-top:12px" onclick="addProdRow()">+ Produto</button>` : ""}
      ${usados.length ? `<p class="muted" style="font-size:13px;margin:14px 0 0">Usados em postagens mas fora da lista: ${usados.map(esc).join(", ")}${S.canWrite ? ` <button class="btn sm" type="button" onclick="${usados.map(x => `addProdRow(${esc(JSON.stringify(x))})`).join(";")}">Adicionar à lista</button>` : ""}</p>` : ""}
      ${saveBar("Salvar produtos")}
    </form>`;
}
function vRedes() {
  const m = marca(), ro = S.canWrite ? "" : " disabled";
  const conta = x => postsMarca().filter(p => redesDe(p.rede).includes(x)).length;
  return headM(m.nome, "Redes") + subnav() +
    `<p class="sec-intro">As redes daqui aparecem para marcar em cada postagem desta marca. Apagar uma rede tira ela da lista; as postagens que já usam continuam com ela marcada até alguém desmarcar.</p>
    <form class="panel" style="max-width:640px" onsubmit="event.preventDefault();salvarLista('rede')">
      <div class="prod-list" id="redeList">${opcoesRede(m).map(x => prodRow(x, conta(x), ro, "rede")).join("") || `<p class="muted" id="semRede">Nenhuma rede. Clique em + Rede.</p>`}</div>
      ${S.canWrite ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" type="button" onclick="addProdRow('', 'rede')">+ Rede</button>
        <button class="btn sm" type="button" onclick="restaurarRedes()">Voltar para a lista padrão</button></div>` : ""}
      ${saveBar("Salvar redes")}
    </form>`;
}
function prodRow(x = "", n = 0, ro = "", tipo = "prod") {
  return `<div class="prod-row"><input data-${tipo} value="${esc(x)}" placeholder="${tipo === "rede" ? "Nome da rede" : "Nome do produto"}"${ro}>${n ? `<span class="n">${n} postage${n === 1 ? "m" : "ns"}</span>` : ""}
    ${ro ? "" : `<button class="icon-btn" type="button" aria-label="Remover" onclick="this.parentNode.remove();S.dirty=true;$('#app .save-bar .msg').textContent='Alterações não salvas'">×</button>`}</div>`;
}
function addProdRow(x = "", tipo = "prod") {
  const box = tipo === "rede" ? "#redeList" : "#prodList";
  $(tipo === "rede" ? "#semRede" : "#semProd")?.remove();
  $(box).insertAdjacentHTML("beforeend", prodRow(x, 0, "", tipo));
  if (!x) $(box + " .prod-row:last-child input").focus();
  S.dirty = true;
}
function restaurarRedes() {
  $("#redeList").innerHTML = REDES.map(x => prodRow(x, 0, "", "rede")).join("");
  S.dirty = true; $("#app .save-bar .msg").textContent = "Alterações não salvas";
}
async function salvarLista(tipo) {
  const lista = [...new Set([...document.querySelectorAll(`[data-${tipo}]`)].map(i => i.value.trim().replace(/\s+\+\s+/g, " ")).filter(Boolean))];
  const m = marca();
  const nova = tipo === "rede" ? { ...m, perfil: { ...perfilDe(m), redes: lista } } : { ...m, produtos: lista };
  try { await api("salvarMarca", { marca: nova }); S.dirty = false; await carregar(); toast(tipo === "rede" ? "Redes salvas" : "Produtos salvos"); }
  catch (e) { writeFail(e); }
}
/* caixa de seleção múltipla: botão que abre a lista, marca vários e permite adicionar um item novo */
function msel(id, ops, marcados, vazio, phNovo, addFn) {
  const ro = !S.canWrite;
  return `<div class="msel" id="${id}" data-vazio="${esc(vazio)}">
    <button type="button" class="msel-btn" onclick="abrirMsel('${id}')" aria-haspopup="listbox"${ro ? " disabled" : ""}>${mselTexto(marcados, vazio)}</button>
    <div class="msel-pop" hidden role="listbox" aria-multiselectable="true">
      ${ops.length ? ops.map(x => mselOp(x, marcados.includes(x))).join("") : `<div class="msel-vazio">Nada cadastrado ainda.</div>`}
      ${ro ? "" : `<div class="msel-add"><input placeholder="${esc(phNovo)}" onkeydown="if(event.key==='Enter'){event.preventDefault();${addFn}}"><button class="btn sm primary" type="button" onclick="${addFn}">Adicionar</button></div>`}
    </div></div>`;
}
const mselOp = (x, on) => `<label class="msel-op"><input type="checkbox" value="${esc(x)}"${on ? " checked" : ""} onchange="mselAtualiza(this)"><span class="ck"></span><span class="nm">${esc(x)}</span></label>`;
function mselTexto(l, vazio) {
  return l.length ? `<span class="txt" title="${esc(l.join(", "))}">${esc(l.join(", "))}</span>${l.length > 1 ? `<span class="cnt">${l.length}</span>` : ""}` : `<span class="txt vazio">${esc(vazio)}</span>`;
}
function mselAtualiza(el) {
  const box = el.closest(".msel");
  box.querySelector(".msel-btn").innerHTML = mselTexto([...box.querySelectorAll(".msel-op input:checked")].map(i => i.value), box.dataset.vazio);
}
function abrirMsel(id) {
  const pop = $("#" + id + " .msel-pop"), abrir = pop.hidden;
  document.querySelectorAll(".msel-pop").forEach(p => p.hidden = true);
  pop.hidden = !abrir;
}
function mselAdiciona(id, nome) {
  const box = $("#" + id), ja = [...box.querySelectorAll(".msel-op input")].find(i => i.value.toLowerCase() === nome.toLowerCase());
  box.querySelector(".msel-vazio")?.remove();
  if (ja) ja.checked = true;
  else box.querySelector(".msel-add").insertAdjacentHTML("beforebegin", mselOp(nome, true));
  box.querySelector(".msel-add input").value = "";
  mselAtualiza(box.querySelector(".msel-op input"));
}
// fecha a lista ao clicar fora ou apertar Esc
document.addEventListener("click", e => { if (!e.target.closest(".msel")) document.querySelectorAll(".msel-pop").forEach(p => p.hidden = true); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && [...document.querySelectorAll(".msel-pop")].some(p => !p.hidden)) { e.preventDefault(); document.querySelectorAll(".msel-pop").forEach(p => p.hidden = true); } }, true);
async function addProdutoEditor() {
  const nome = ($("#eProdutos .msel-add input").value || "").trim().replace(/\s+\+\s+/g, " ");
  if (!nome) return toast("Escreva o nome do produto.");
  const m = marca(), lista = m.produtos || [];
  if (!lista.includes(nome)) {
    try { await api("salvarMarca", { marca: { ...m, produtos: lista.concat(nome) } }); m.produtos = lista.concat(nome); }
    catch (e) { return writeFail(e); }
  }
  mselAdiciona("eProdutos", nome);
  toast(`"${nome}" adicionado aos produtos da marca`);
}

  return headM(m.nome, "Configurações") + subnav() + (adm ? "" : `<p class="sec-intro">Só quem alimenta a marca (social media, gestor, diretor e administrador) altera o nome, as fases e as configurações.</p>`) +

const ETAPAS = ["Ideia", "Em validação", "Em produção", "Em aprovação", "Aprovado", "Agendado", "Postado"];
function etapaDe(st) { return st === "Ideia reprovada" ? "Ideia" : st === "Ajustes solicitados" ? "Em produção" : st; }
function fluxoHtml(p) {
  const at = ETAPAS.indexOf(etapaDe(p.status));

  const rej = S.rejDlg;
  const hist = (p.historico || []).slice().reverse();
  return `<div class="fluxo">
